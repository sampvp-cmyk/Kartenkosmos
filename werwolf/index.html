const SETS = [
  { name: "Grundspiel", roles: ["seer", "witch", "hunter", "amor", "girl"] },
  { name: "Neumond", roles: ["guard", "elder", "scapegoat", "idiot", "piper"] },
  { name: "Charaktere", roles: ["wildchild", "wolfdog", "sister", "brother", "fox", "bear", "knight", "judge", "angel", "urwolf", "bigwolf", "whitewolf"] },
  { name: "Weitere Rollen", note: "Bekannte Rollen aus anderen Werwolf-Varianten.", roles: ["raven", "apprentice", "lycan", "cursed", "prince", "tough"] },
];
const AUTO_ROLES = ["seer", "witch", "hunter", "amor"];
const WOLF_ROLES = ["wolf", "urwolf", "bigwolf", "whitewolf"];
const MIN_PLAYERS = 4;
const roleName = (r) => ROLES[r].short || ROLES[r].name;

const autoWolves = (n, roles) => {
  const extra = ["urwolf", "bigwolf", "whitewolf"].filter((r) => roles[r]).length;
  return Math.max(extra ? 0 : 1, Math.round(n / 4.5) - extra);
};
const autoRoles = (n) => ({ seer: n >= 5 ? 1 : 0, witch: n >= 6 ? 1 : 0, hunter: n >= 7 ? 1 : 0, amor: n >= 8 ? 1 : 0 });
const cardCount = (roles) => Object.entries(roles).reduce((a, [r, on]) => a + (r === "wolf" ? on : on ? ROLES[r].count || 1 : 0), 0);
const wolfTeam = (roles) => roles.wolf + ["urwolf", "bigwolf", "whitewolf"].filter((r) => roles[r]).length;

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

// ── Spiellogik ────────────────────────────────────────────────────────────────
function newGame(names, roles, opts) {
  const deck = [];
  Object.entries(roles).forEach(([r, on]) => {
    const k = r === "wolf" ? on : on ? ROLES[r].count || 1 : 0;
    for (let i = 0; i < k; i++) deck.push(r);
  });
  while (deck.length < names.length) deck.push("villager");
  const dealt = shuffle(deck);
  return {
    created: Date.now(), showRoles: opts.showRoles, captainOn: opts.captain,
    players: names.map((name, i) => ({ name, role: dealt[i], alive: true })),
    phase: "reveal", revealIdx: 0,
    night: 0, steps: [], step: 0, nd: {}, lastProtect: null,
    potions: { heal: true, poison: true },
    announce: null, pendingHunters: [], pendingCaptain: false, captain: null, winner: null, log: [],
    delayed: [], raven: null, elderHit: false, powersLost: false, foxLost: false, wolfDied: false, infectUsed: false, judgeUsed: false, angelWon: false,
  };
}

const isWolf = (p) => WOLF_ROLES.includes(p.role) || !!p.infected;
const hasRole = (g, r) => g.players.some((p) => p.role === r || p.orig === r);
const alive = (g) => g.players.map((p, i) => i).filter((i) => g.players[i].alive);
const holders = (g, r) => g.players.map((p, i) => i).filter((i) => g.players[i].role === r);
const firstAlive = (g, r) => holders(g, r).find((i) => g.players[i].alive);
const nameList = (g, ids) => ids.map((i) => g.players[i].name).join(", ");

// nächste lebende Nachbarn in Sitzreihenfolge (links = nächster in der Liste)
function neighbours(g, i) {
  const n = g.players.length, res = [];
  for (const dir of [1, -1]) {
    for (let k = 1; k < n; k++) {
      const j = (i + dir * k + n * n) % n;
      if (j === i) break;
      if (g.players[j].alive) { if (!res.includes(j)) res.push(j); break; }
    }
  }
  return res;
}

// Rollen werden auch aufgerufen, wenn sie schon tot sind – sonst merkt der Tisch, wer gestorben ist
function nightSteps(g) {
  const s = [];
  const has = (r) => hasRole(g, r);
  if (g.night === 1) ["amor", "wildchild", "wolfdog", "sister", "brother"].forEach((r) => has(r) && s.push(r));
  if (has("guard")) s.push("guard");
  if (has("seer") || has("apprentice")) s.push("seer");
  if (has("fox")) s.push("fox");
  s.push("wolf");
  if (has("whitewolf") && g.night % 2 === 0) s.push("whitewolf");
  if (has("bigwolf")) s.push("bigwolf");
  if (has("witch")) s.push("witch");
  if (has("piper")) s.push("piper");
  if (has("raven")) s.push("raven");
  return s;
}

// Wer handelt in diesem Schritt? null = tot oder ohne Kraft
function actor(g, kind) {
  if (kind === "wolf") return g.players.some((p) => p.alive && isWolf(p)) ? -1 : null;
  if (ROLES[kind].team === "village" && g.powersLost) return null;
  if (kind === "fox" && g.foxLost) return null;
  if (kind === "bigwolf" && g.wolfDied) return null;
  if (kind === "seer") {
    const s = firstAlive(g, "seer");
    return s != null ? s : firstAlive(g, "apprentice") ?? null;
  }
  if (kind === "sister" || kind === "brother") return holders(g, kind).some((i) => g.players[i].alive) ? -1 : null;
  // Wolfshund hat nach seiner Wahl schon eine neue Rolle (falls man zurückblättert)
  const i = g.players.findIndex((p) => p.alive && (p.role === kind || (kind === "wolfdog" && p.orig === kind)));
  return i >= 0 ? i : null;
}

function startNight(g) {
  const n = { ...g, phase: "night", night: g.night + 1, step: 0, nd: {}, announce: null };
  n.steps = nightSteps(n);
  return n;
}

// Tote eintragen, Liebespaar mitnehmen, Folgen auslösen (Jäger, Hauptmann, Wildes Kind, Dorfältester, Engel)
function applyDeaths(g, ids, wolfKills = []) {
  const players = g.players.map((p) => ({ ...p }));
  const dead = [];
  const queue = [...ids];
  while (queue.length) {
    const id = queue.shift();
    if (!players[id].alive) continue;
    players[id].alive = false;
    dead.push(id);
    if (players[id].lover) players.forEach((p, j) => { if (p.lover && p.alive && j !== id) queue.push(j); });
  }
  let n = { ...g, players };
  dead.forEach((i) => {
    const p = players[i];
    if (isWolf(p)) n.wolfDied = true;
    if (p.role === "elder" && !wolfKills.includes(i)) n.powersLost = true;
    if (p.role === "angel" && g.night <= 1) n.angelWon = true;
    if (i === g.captain) n.pendingCaptain = true;
  });
  players.forEach((p) => { if (p.alive && p.role === "wildchild" && dead.includes(p.model)) { p.orig = "wildchild"; p.role = "wolf"; } });
  const hunters = n.powersLost ? [] : dead.filter((i) => players[i].role === "hunter");
  return { ...n, pendingHunters: [...g.pendingHunters, ...hunters], _dead: dead };
}

function finishNight(g) {
  const nd = g.nd;
  const players = g.players.map((p) => ({ ...p }));
  let { elderHit, infectUsed, foxLost } = g;
  const deaths = g.delayed.filter((i) => players[i].alive), wolfKills = [], delayed = [];
  const attack = (i) => {
    if (i == null || i === nd.protect || i === nd.heal) return;
    const p = players[i];
    if (nd.infect && i === nd.victim) { p.infected = true; infectUsed = true; return; }
    if (p.role === "elder" && !elderHit) { elderHit = true; return; }
    if (p.role === "cursed") { p.orig = "cursed"; p.role = "wolf"; return; }
    if (p.role === "tough") { delayed.push(i); return; }
    deaths.push(i); wolfKills.push(i);
    if (p.role === "knight" && !g.powersLost) {
      const n = players.length;
      for (let k = 1; k < n; k++) { const j = (i + k) % n; if (players[j].alive && isWolf(players[j])) { delayed.push(j); break; } }
    }
  };
  attack(nd.victim);
  attack(nd.bigVictim);
  if (nd.whiteVictim != null) deaths.push(nd.whiteVictim);
  if (nd.poison != null) deaths.push(nd.poison);
  (nd.charm || []).forEach((i) => { players[i].charmed = true; });
  if (nd.fox != null && ![nd.fox, ...neighbours(g, nd.fox)].some((i) => isWolf(g.players[i]))) foxLost = true;
  const potions = { heal: g.potions.heal && nd.heal == null, poison: g.potions.poison && nd.poison == null };

  let n = applyDeaths({ ...g, players, potions, elderHit, infectUsed, foxLost, delayed, raven: nd.raven ?? null, lastProtect: nd.protect ?? null },
    [...new Set(deaths)], wolfKills);
  const notes = [];
  const bear = firstAlive(n, "bear");
  if (bear != null && !n.powersLost) notes.push(neighbours(n, bear).some((i) => isWolf(n.players[i])) ? "🐻 Grrr! Der Bär brummt – neben dem Bärenführer sitzt ein Werwolf!" : "🐻 Der Bär bleibt ruhig.");
  if (n.raven != null && n.players[n.raven].alive) notes.push(`🐦‍⬛ Der Rabe hat ${n.players[n.raven].name} markiert: heute 2 Stimmen mehr gegen ${n.players[n.raven].name}.`);
  const names = n._dead.map((i) => g.players[i].name);
  return { ...n, phase: "announce", log: [...g.log, `Nacht ${g.night}: ${names.length ? "† " + names.join(", ") : "niemand gestorben"}`],
    announce: { title: `☀️ Morgen nach Nacht ${g.night}`, dead: n._dead, notes, empty: "Das Dorf erwacht – heute Nacht ist niemand gestorben!", next: "day" } };
}

function winner(g) {
  if (g.angelWon) return "angel";
  const a = alive(g);
  if (a.length === 0) return "none";
  const piper = a.find((i) => g.players[i].role === "piper");
  if (piper != null && a.every((i) => i === piper || g.players[i].charmed)) return "piper";
  if (a.length === 2 && a.every((i) => g.players[i].lover) && isWolf(g.players[a[0]]) !== isWolf(g.players[a[1]])) return "lovers";
  const wolves = a.filter((i) => isWolf(g.players[i])).length;
  const white = a.find((i) => g.players[i].role === "whitewolf");
  if (white != null) return a.length === 1 ? "white" : null;
  if (wolves === 0) return piper != null ? null : "village";
  if (wolves >= a.length - wolves) return "wolf";
  return null;
}

const WIN = {
  village: { emoji: "🏡", title: "Das Dorf gewinnt!", text: "Alle Werwölfe sind besiegt." },
  wolf: { emoji: "🐺", title: "Die Werwölfe gewinnen!", text: "Das Dorf ist den Werwölfen nicht mehr gewachsen." },
  lovers: { emoji: "💞", title: "Das Liebespaar gewinnt!", text: "Nur noch die beiden Verliebten sind übrig." },
  piper: { emoji: "🪈", title: "Der Flötenspieler gewinnt!", text: "Alle Überlebenden sind verzaubert." },
  white: { emoji: "🐻‍❄️", title: "Der Weiße Werwolf gewinnt!", text: "Er ist als Einziger übrig geblieben." },
  angel: { emoji: "😇", title: "Der Engel gewinnt!", text: "Er ist in der ersten Runde gestorben – genau wie geplant." },
  none: { emoji: "🪦", title: "Niemand gewinnt", text: "Alle sind tot." },
};

// ── Speicher ──────────────────────────────────────────────────────────────────
function loadState() {
  const base = { names: [], showRoles: true, captain: false, roles: null, auto: true, game: null };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...base, ...JSON.parse(raw) };
    const old = localStorage.getItem("werwolf-v1");
    if (old) return { ...base, names: JSON.parse(old).names || [] };
  } catch (e) {}
  return base;
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// ── UI-Bausteine ──────────────────────────────────────────────────────────────
const page = { maxWidth: 560, margin: "0 auto", padding: "calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)" };

function TopBar({ left, title, right }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", minHeight: 48, marginBottom: 12 }}>
      <div style={{ justifySelf: "start" }}>{left}</div>
      <div style={{ fontSize: 19, fontWeight: 600, textAlign: "center", maxWidth: "52vw", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</div>
      <div style={{ justifySelf: "end" }}>{right}</div>
    </div>
  );
}

function IconBtn({ children, onClick, label }) {
  return (
    <button aria-label={label} onClick={onClick} style={{ minWidth: 40, height: 40, padding: "0 12px", borderRadius: 20, border: `1px solid ${C.line}`, background: C.card, color: C.text, fontSize: 16, cursor: "pointer" }}>
      {children}
    </button>
  );
}

function Label({ children }) {
  return <div style={{ color: C.dim, fontSize: 14, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.6, margin: "0 6px 6px" }}>{children}</div>;
}

function Section({ title, children, footer }) {
  return (
    <div style={{ marginBottom: 20 }}>
      {title && <Label>{title}</Label>}
      <div style={{ background: C.card, borderRadius: 16, border: `1px solid ${C.line}`, overflow: "hidden" }}>{children}</div>
      {footer && <div style={{ color: C.dim, fontSize: 13, margin: "8px 6px 0", lineHeight: 1.4 }}>{footer}</div>}
    </div>
  );
}

function Row({ children, onClick, last }) {
  return (
    <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 10, minHeight: 50, padding: "8px 14px", borderBottom: last ? "none" : `1px solid ${C.line}`, cursor: onClick ? "pointer" : "default" }}>
      {children}
    </div>
  );
}

function BigButton({ children, onClick, disabled, color = C.accent, style }) {
  return (
    <button onClick={disabled ? undefined : onClick} disabled={disabled}
      style={{ flex: 1, minWidth: 0, height: 50, borderRadius: 14, border: "none", background: disabled ? "var(--dis-bg)" : color, color: disabled ? "var(--dis-fg)" : color === C.card2 ? C.text : "#fff", fontSize: 17, fontWeight: 600, cursor: disabled ? "default" : "pointer", padding: "0 6px", ...style }}>
      {children}
    </button>
  );
}

function BottomBar({ children, hint, hintColor }) {
  return (
    <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 5, background: "linear-gradient(transparent, var(--bg) 30%)", padding: "24px 16px calc(env(safe-area-inset-bottom) + 14px)" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>
        {hint && <div style={{ textAlign: "center", fontSize: 14, marginBottom: 8, color: hintColor || C.dim, fontWeight: 500 }}>{hint}</div>}
        <div style={{ display: "flex", gap: 10 }}>{children}</div>
      </div>
    </div>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 20, background: "#0008", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div className="pop" onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 560, background: "var(--sheet)", borderRadius: "20px 20px 0 0", border: `1px solid ${C.line}`, padding: "18px 16px calc(env(safe-area-inset-bottom) + 18px)", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ fontSize: 18, fontWeight: 600, textAlign: "center", marginBottom: 14 }}>{title}</div>
        {children}
      </div>
    </div>
  );
}

function Toggle({ on, onChange }) {
  return (
    <button aria-pressed={on} onClick={() => onChange(!on)}
      style={{ width: 52, height: 32, borderRadius: 16, border: "none", background: on ? C.good : "var(--toggle-off)", position: "relative", cursor: "pointer", flexShrink: 0, transition: "background .15s" }}>
      <span style={{ position: "absolute", top: 3, left: on ? 23 : 3, width: 26, height: 26, borderRadius: 13, background: "#fff", transition: "left .15s" }} />
    </button>
  );
}

function Stepper({ value, onChange, min = 0, max }) {
  const btn = (txt, d, dis) => (
    <button onClick={() => !dis && onChange(value + d)} disabled={dis} aria-label={d > 0 ? "Mehr" : "Weniger"}
      style={{ width: 36, height: 36, borderRadius: 18, border: "none", background: dis ? "var(--dis-bg)" : C.card2, color: dis ? "var(--dis-fg)" : C.text, fontSize: 20, cursor: dis ? "default" : "pointer" }}>{txt}</button>
  );
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
      {btn("−", -1, value <= min)}
      <span style={{ minWidth: 22, textAlign: "center", fontSize: 18, fontWeight: 600 }}>{value}</span>
      {btn("+", 1, max != null && value >= max)}
    </div>
  );
}

const TEAM = {
  wolf: { label: "Team Werwölfe", bg: "linear-gradient(160deg, #7f1d1d, #2a0d14)", border: "#f87171" },
  village: { label: "Team Dorf", bg: "linear-gradient(160deg, #3b4bd8, #1a1b4b)", border: "#ffd166" },
  solo: { label: "Spielt allein", bg: "linear-gradient(160deg, #7c3aed, #2a0f4b)", border: "#c4b5fd" },
};

// Rollenkarte zum Aufdecken
function RoleCard({ role, small }) {
  const r = ROLES[role];
  const t = TEAM[r.team];
  return (
    <div className="flip" style={{ margin: "0 auto", width: small ? "100%" : "min(78vw, 300px)", minHeight: small ? undefined : "min(109vw, 420px)", borderRadius: 22, padding: small ? 16 : 22,
      background: t.bg, color: "#fff", border: `3px solid ${t.border}`, boxShadow: "0 12px 40px #0007",
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", gap: 10 }}>
      <div style={{ fontSize: small ? 48 : 88, lineHeight: 1 }}>{r.emoji}</div>
      <div style={{ fontSize: small ? 24 : 28, fontWeight: 700, lineHeight: 1.15 }}>{r.name}</div>
      <div style={{ fontSize: 13, textTransform: "uppercase", letterSpacing: 1, opacity: 0.8 }}>{t.label}</div>
      <div style={{ fontSize: 15, lineHeight: 1.4, opacity: 0.92 }}>{r.desc}</div>
    </div>
  );
}

// Spieler antippen (einer oder mehrere)
function PlayerPicker({ g, value, onChange, max = 1, filter = () => true, mark = () => null }) {
  const sel = Array.isArray(value) ? value : value == null ? [] : [value];
  const tap = (i) => {
    if (max === 1) return onChange(sel.includes(i) ? null : i);
    if (sel.includes(i)) onChange(sel.filter((x) => x !== i));
    else if (sel.length < max) onChange([...sel, i]);
  };
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 8 }}>
      {g.players.map((p, i) => {
        if (!p.alive) return null;
        const ok = filter(i);
        const on = sel.includes(i);
        const m = mark(i);
        return (
          <button key={i} onClick={() => ok && tap(i)} disabled={!ok}
            style={{ minHeight: 52, padding: "6px 10px", borderRadius: 14, border: on ? `2px solid ${C.accent}` : `1px solid ${C.line}`, background: on ? "var(--sel)" : C.card,
              color: ok ? C.text : "var(--dis-fg)", fontSize: 16, fontWeight: on ? 600 : 500, cursor: ok ? "pointer" : "default", textAlign: "left", display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{on ? "✓ " : ""}{p.name}</span>
            {m && <span style={{ fontSize: 13, color: C.dim }}>{m}</span>}
          </button>
        );
      })}
    </div>
  );
}
const candidates = (g, filter) => alive(g).filter(filter);

function Say({ children }) {
  return (
    <div style={{ background: C.card2, borderRadius: 14, padding: "12px 14px", fontSize: 16, lineHeight: 1.45, marginBottom: 16, fontStyle: "italic" }}>
      🗣️ „{children}“
    </div>
  );
}

function Note({ children, color }) {
  return <div style={{ color: color || C.dim, lineHeight: 1.45, margin: "12px 4px 0", fontSize: 15 }}>{children}</div>;
}

// ── Startseite ────────────────────────────────────────────────────────────────

  return (
    <div style={page} className="pop">
      <TopBar left={<IconBtn label="Startmenü" onClick={() => { location.href = "../"; }}>🏠</IconBtn>} title="🐺 Werwolf" />
      <div style={{ textAlign: "center", padding: "30px 10px 26px" }}>
        <div style={{ fontSize: 72 }}>🌕</div>
        <div style={{ fontSize: 24, fontWeight: 600, marginTop: 8 }}>Die Werwölfe von Düsterwald</div>
        <div style={{ color: C.dim, marginTop: 8, lineHeight: 1.45 }}>Karten verteilen, durch die Nacht führen, Abstimmungen festhalten – das Handy ist euer Spielleiter-Helfer. Mit über 25 Rollen aus Grundspiel, Neumond, Charaktere und mehr.</div>
      </div>
      {g && !g.winner && (
        <Section title="Laufendes Spiel">
          <Row onClick={onContinue} last>

            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600 }}>{g.players.length} Spieler · {g.phase === "reveal" ? "Karten verteilen" : `Runde ${Math.max(1, g.night)}`}</div>
              <div style={{ color: C.dim, fontSize: 14 }}>{alive(g).length} leben noch</div>
            </div>
            <span style={{ color: C.dim, fontSize: 24 }}>›</span>
          </Row>
        </Section>
      )}
      <Section title="So geht's" footer="Ein Spieler (oder jemand ohne Karte) ist Spielleiter und behält nachts das Handy. Gespielt werden kann mit beliebig vielen Spielern.">
        {[["🃏", "Handy reihum weitergeben – jeder schaut heimlich seine Karte an."],
          ["🌙", "Nachts ruft der Spielleiter die Rollen nacheinander auf und tippt ihre Wahl ein."],
          ["☀️", "Morgens verkündet die App die Toten, tagsüber stimmt das Dorf ab."],
          ["🏆", "Die App prüft nach jedem Tod, ob Dorf, Werwölfe oder ein Einzelgänger gewonnen haben."]].map(([e, t], i, a) => (
          <Row key={i} last={i === a.length - 1}><span style={{ fontSize: 22 }}>{e}</span><span style={{ lineHeight: 1.4 }}>{t}</span></Row>
        ))}
      </Section>
      <BottomBar>
        {g && !g.winner && <BigButton color={C.card2} onClick={onContinue}>Weiterspielen</BigButton>}

}

// ── Neues Spiel ───────────────────────────────────────────────────────────────
function Setup({ state, onCancel, onStart }) {
  const [names, setNames] = useState(() => (state.names.length ? [...state.names, ""] : ["", "", "", "", ""]));
  const players = names.map((n) => n.trim()).filter(Boolean);
  const n = players.length;
  const [picked, setPicked] = useState(() => state.roles || { wolf: 2 });
  const [auto, setAuto] = useState(state.auto);
  const [showRoles, setShowRoles] = useState(state.showRoles);
  const [captain, setCaptain] = useState(state.captain);
  const [info, setInfo] = useState(null);
  // automatisch: Werwölfe und Grundrollen passend zur Spielerzahl, alles andere bleibt wie gewählt
  const r = auto ? { ...picked, ...autoRoles(Math.max(MIN_PLAYERS, n)), wolf: autoWolves(Math.max(MIN_PLAYERS, n), picked) } : picked;
  const villagers = n - cardCount(r);
  const wolves = wolfTeam(r);
  const dupes = new Set(players.map((p) => p.toLowerCase())).size !== n;

  const setName = (i, v) => {
    const next = names.map((x, j) => (j === i ? v : x));
    if (i === next.length - 1 && v.trim()) next.push("");
    setNames(next);
  };
  const removeName = (i) => setNames(names.filter((_, j) => j !== i));
  const setRole = (k, v) => {
    setPicked({ ...r, [k]: v });
    if (k === "wolf" || AUTO_ROLES.includes(k)) setAuto(false);
  };

  let problem = null;
  if (n < MIN_PLAYERS) problem = `Mindestens ${MIN_PLAYERS} Spieler`;
  else if (dupes) problem = "Jeder Name nur einmal";
  else if (villagers < 0) problem = `${-villagers} Rolle${villagers < -1 ? "n" : ""} zu viel für ${n} Spieler`;
  else if (wolves < 1) problem = "Mindestens ein Werwolf";
  else if (wolves >= n - wolves) problem = "Zu viele Werwölfe";

  const roleRow = (k, last) => (
    <Row key={k} last={last}>
      <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>{ROLES[k].emoji}</span>
      <span onClick={() => setInfo(k)} style={{ flex: 1, cursor: "pointer" }}>{ROLES[k].plural && ROLES[k].count ? ROLES[k].plural : ROLES[k].name} <span style={{ color: C.dim, fontSize: 14 }}>ⓘ</span></span>
      <Toggle on={!!r[k]} onChange={(on) => setRole(k, on ? 1 : 0)} />
    </Row>
  );

  return (
    <div style={page} className="pop">
      <TopBar left={<IconBtn label="Zurück" onClick={onCancel}>‹ Zurück</IconBtn>} title="Neues Spiel" />
      <Section title={`Spieler (${n})`} footer="In Sitzreihenfolge (im Uhrzeigersinn) eintragen – wichtig für Fuchs, Bärenführer und Ritter. Die Namen werden fürs nächste Spiel gemerkt.">
        {names.map((v, i) => (
          <Row key={i} last={i === names.length - 1}>
            <span style={{ color: C.dim, width: 26, textAlign: "right" }}>{i + 1}.</span>
            <input value={v} onChange={(e) => setName(i, e.target.value)} placeholder={i === names.length - 1 ? "Spieler hinzufügen …" : "Name"}
              style={{ flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", color: C.text, fontSize: 17 }} />
            {v && i !== names.length - 1 && <button aria-label="Entfernen" onClick={() => removeName(i)} style={{ border: "none", background: "transparent", color: C.dim, fontSize: 18, cursor: "pointer" }}>✕</button>}
          </Row>
        ))}
      </Section>

      <Section title="Werwölfe & Dorf" footer={auto ? "Werwölfe, Seherin, Hexe, Jäger und Amor werden automatisch passend zur Spielerzahl gewählt. Tippe auf eine Rolle für ihre Beschreibung." : "Tippe auf eine Rolle für ihre Beschreibung."}>
        <Row>
          <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>✨</span><span style={{ flex: 1 }}>Automatisch verteilen</span>
          <Toggle on={auto} onChange={(on) => { setAuto(on); if (!on) setPicked(r); }} />
        </Row>
        <Row>
          <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>{ROLES.wolf.emoji}</span>
          <span onClick={() => setInfo("wolf")} style={{ flex: 1, cursor: "pointer" }}>{ROLES.wolf.plural} <span style={{ color: C.dim, fontSize: 14 }}>ⓘ</span></span>
          <Stepper value={r.wolf} min={0} onChange={(v) => setRole("wolf", v)} />
        </Row>
        <Row last>
          <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>{ROLES.villager.emoji}</span><span style={{ flex: 1 }}>{ROLES.villager.plural}</span>
          <span style={{ fontSize: 18, fontWeight: 600, color: villagers < 0 ? C.bad : C.text, paddingRight: 8 }}>{villagers}</span>
        </Row>
      </Section>

      {SETS.map((s) => (
        <Section key={s.name} title={s.name} footer={s.note}>
          {s.roles.map((k, i) => roleRow(k, i === s.roles.length - 1))}
        </Section>
      ))}

      <Section title="Optionen">
        <Row>
          <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>🎖️</span>
          <div style={{ flex: 1 }}><div>Hauptmann wählen</div><div style={{ color: C.dim, fontSize: 13 }}>Am ersten Tag gewählt, seine Stimme zählt doppelt</div></div>
          <Toggle on={captain} onChange={setCaptain} />
        </Row>
        <Row last>
          <span style={{ fontSize: 22, width: 28, textAlign: "center" }}>🪦</span>
          <div style={{ flex: 1 }}><div>Rollen der Toten aufdecken</div><div style={{ color: C.dim, fontSize: 13 }}>Beim Tod wird die Karte allen gezeigt</div></div>
          <Toggle on={showRoles} onChange={setShowRoles} />
        </Row>
      </Section>

      <BottomBar hint={problem || `${n} Spieler · ${wolves} im Werwolf-Team · ${villagers} Dorfbewohner`} hintColor={problem ? C.bad : C.dim}>
        <BigButton disabled={!!problem} onClick={() => onStart(players, r, { showRoles, captain, auto })}>Karten mischen 🃏</BigButton>
      </BottomBar>

      {info && (
        <Sheet title={ROLES[info].name} onClose={() => setInfo(null)}>
          <RoleCard role={info} small />
          <div style={{ display: "flex", marginTop: 14 }}><BigButton color={C.card2} onClick={() => setInfo(null)}>Schließen</BigButton></div>
        </Sheet>
      )}
    </div>
  );
}

// ── Karten ansehen ────────────────────────────────────────────────────────────
function Reveal({ g, update }) {
  const [shown, setShown] = useState(false);
  const p = g.players[g.revealIdx];
  const last = g.revealIdx === g.players.length - 1;

  if (!p) {
    return (
      <div style={{ ...page, textAlign: "center" }} className="pop">
        <div style={{ fontSize: 72, marginTop: 60 }}>🌙</div>
        <div style={{ fontSize: 24, fontWeight: 600, margin: "12px 0 8px" }}>Alle kennen ihre Rolle</div>
        <div style={{ color: C.dim, lineHeight: 1.45 }}>Gebt das Handy dem Spielleiter. Dann schließt alle die Augen – die erste Nacht beginnt.</div>
        <BottomBar><BigButton onClick={() => update(startNight(g))}>Nacht beginnen 🌙</BigButton></BottomBar>
      </div>
    );
  }

  const others = (pred) => g.players.filter((q, i) => i !== g.revealIdx && pred(q)).map((q) => q.name);
  let extra = null;
  if (WOLF_ROLES.includes(p.role)) {
    const pack = others((q) => WOLF_ROLES.includes(q.role));
    extra = pack.length ? `Dein Rudel: ${pack.join(", ")}` : "Du bist der einzige Werwolf.";
  } else if (p.role === "sister" || p.role === "brother") {
    extra = `Deine Geschwister: ${others((q) => q.role === p.role).join(", ")}`;
  }

  return (
    <div style={{ ...page, textAlign: "center" }} className="pop">
      <div style={{ color: C.dim, marginTop: 8 }}>Karte {g.revealIdx + 1} von {g.players.length}</div>
      {!shown ? (
        <>
          <div style={{ fontSize: 64, marginTop: 50 }}>🤫</div>
          <div style={{ fontSize: 18, color: C.dim, marginTop: 16 }}>Gib das Handy an</div>
          <div style={{ fontSize: 34, fontWeight: 700, margin: "4px 0 14px" }}>{p.name}</div>
          <div style={{ color: C.dim, lineHeight: 1.45 }}>Nur {p.name} darf jetzt aufs Display schauen!</div>
          <BottomBar><BigButton onClick={() => setShown(true)}>Ich bin {p.name} – Karte zeigen</BigButton></BottomBar>
        </>
      ) : (
        <>
          <div style={{ fontSize: 20, fontWeight: 600, margin: "6px 0 14px" }}>{p.name}, du bist …</div>
          <RoleCard role={p.role} />
          {extra && <div style={{ marginTop: 14, color: C.dim }}>{extra}</div>}
          <BottomBar hint="Merk dir deine Rolle und verdecke sie wieder.">
            <BigButton onClick={() => { setShown(false); update({ ...g, revealIdx: g.revealIdx + 1 }); }}>{last ? "Verdecken – fertig" : "Verdecken & weitergeben"}</BigButton>
          </BottomBar>
        </>
      )}
    </div>
  );
}

// ── Nacht ─────────────────────────────────────────────────────────────────────
const STEP = {
  amor: { title: "Amor", say: "Amor erwacht und zeigt auf zwei Spieler, die sich unsterblich ineinander verlieben." },
  wildchild: { title: "Wildes Kind", say: "Das Wilde Kind erwacht und zeigt auf sein Vorbild." },
  wolfdog: { title: "Wolfshund", say: "Der Wolfshund erwacht und entscheidet: Will er Dorfbewohner oder Werwolf sein?" },
  sister: { title: "Zwei Schwestern", say: "Die beiden Schwestern erwachen und erkennen sich." },
  brother: { title: "Drei Brüder", say: "Die drei Brüder erwachen und erkennen sich." },
  guard: { title: "Beschützer", say: "Der Beschützer erwacht und zeigt auf einen Spieler, den er heute Nacht beschützen will." },
  seer: { title: "Seherin", say: "Die Seherin erwacht und zeigt auf einen Spieler, dessen Karte sie sehen möchte." },
  fox: { title: "Fuchs", say: "Der Fuchs erwacht und zeigt auf einen Spieler. Ich verrate ihm, ob bei dieser Dreiergruppe ein Werwolf dabei ist." },
  wolf: { title: "Die Werwölfe", say: "Die Werwölfe erwachen, erkennen sich und einigen sich leise auf ein Opfer." },
  whitewolf: { title: "Weißer Werwolf", say: "Der Weiße Werwolf erwacht und darf, wenn er will, einen Werwolf töten." },
  bigwolf: { title: "Großer böser Wolf", say: "Der Große böse Wolf erwacht und sucht sich ein zweites Opfer aus." },
  witch: { title: "Hexe", say: "Die Hexe erwacht. Ich zeige ihr die Opfer der Werwölfe. Will sie ihren Heiltrank oder ihren Gifttrank benutzen?" },
  piper: { title: "Flötenspieler", say: "Der Flötenspieler erwacht und verzaubert zwei Spieler." },
  raven: { title: "Rabe", say: "Der Rabe erwacht und zeigt auf einen Spieler, den er verdächtigt." },
};

function Night({ g, update }) {
  const kind = g.steps[g.step];
  const nd = g.nd;
  const setNd = (patch) => update({ ...g, nd: { ...nd, ...patch } });
  const who = actor(g, kind);
  const r = ROLES[kind];
  const s = STEP[kind];
  const isP = (i, pred) => pred(g.players[i]);

  let body = null, ready = true;
  if (who == null) {
    const why = kind === "wolf" ? "Es lebt kein Werwolf mehr" : g.powersLost && r.team === "village" ? `${s.title}: Die Dorfbewohner haben ihre Kräfte verloren` :
      kind === "fox" && g.foxLost ? "Der Fuchs hat seine Kraft verloren" : kind === "bigwolf" && g.wolfDied ? "Seit ein Werwolf gestorben ist, frisst der Große böse Wolf nicht mehr extra" : `${s.title}: tot`;
    body = <div style={{ color: C.dim, lineHeight: 1.45 }}>{why}. Trotzdem kurz aufrufen und ein paar Sekunden warten, damit niemand etwas merkt.</div>;
  } else if (kind === "amor") {
    ready = (nd.lovers || []).length === 2;
    body = (
      <>
        <PlayerPicker g={g} value={nd.lovers || []} max={2} onChange={(v) => setNd({ lovers: v })} />
        {ready && <Note>Amor schläft ein. Tippe {nameList(g, nd.lovers)} an die Schulter – sie öffnen kurz die Augen und erkennen sich.</Note>}
      </>
    );
  } else if (kind === "wildchild") {
    ready = nd.model != null;
    body = <PlayerPicker g={g} value={nd.model} onChange={(v) => setNd({ model: v })} filter={(i) => i !== who} />;
  } else if (kind === "wolfdog") {
    ready = nd.dog != null;
    body = (
      <div style={{ display: "flex", gap: 10 }}>
        {["villager", "wolf"].map((x) => (
          <BigButton key={x} color={nd.dog === x ? (x === "wolf" ? C.wolf : C.accent) : C.card2} onClick={() => setNd({ dog: x })}>{ROLES[x].emoji} {ROLES[x].name}</BigButton>
        ))}
      </div>
    );
  } else if (kind === "sister" || kind === "brother") {
    body = <div style={{ fontSize: 17 }}>{r.emoji} {nameList(g, holders(g, kind).filter((i) => g.players[i].alive))}</div>;
  } else if (kind === "guard") {
    ready = nd.protect != null;
    body = <PlayerPicker g={g} value={nd.protect} onChange={(v) => setNd({ protect: v })} filter={(i) => i !== g.lastProtect} mark={(i) => (i === g.lastProtect ? "letzte Nacht" : null)} />;
  } else if (kind === "seer") {
    ready = nd.seen != null;
    const seenAs = (p) => (p.role === "lycan" ? "wolf" : p.role);
    body = (
      <>
        {g.players[who].role === "apprentice" && <Note color={C.gold}>Die Seherin ist tot – der Seher-Lehrling ({g.players[who].name}) übernimmt.</Note>}
        <div style={{ height: 10 }} />
        <PlayerPicker g={g} value={nd.seen} onChange={(v) => setNd({ seen: v })} filter={(i) => i !== who} />
        {ready && <div style={{ marginTop: 16 }}><div style={{ color: C.dim, textAlign: "center", marginBottom: 8 }}>Zeig die Karte: {g.players[nd.seen].name} ist …</div><RoleCard role={seenAs(g.players[nd.seen])} small /></div>}
      </>
    );
  } else if (kind === "fox") {
    ready = nd.fox != null;
    const hit = ready && [nd.fox, ...neighbours(g, nd.fox)].some((i) => isWolf(g.players[i]));
    body = (
      <>
        <PlayerPicker g={g} value={nd.fox} onChange={(v) => setNd({ fox: v })} />
        {ready && <Note color={hit ? C.good : C.bad}>{hit ? "👍 Ja – bei " + nameList(g, [nd.fox, ...neighbours(g, nd.fox)]) + " ist ein Werwolf. Der Fuchs behält seine Kraft." : "👎 Nein – kein Werwolf bei " + nameList(g, [nd.fox, ...neighbours(g, nd.fox)]) + ". Der Fuchs verliert seine Kraft."}</Note>}
      </>
    );
  } else if (kind === "wolf") {
    const prey = (i) => !isP(i, isWolf);
    ready = nd.victim != null || candidates(g, prey).length === 0;
    const ur = firstAlive(g, "urwolf");
    body = (
      <>
        <div style={{ color: C.dim, marginBottom: 10 }}>Rudel: {nameList(g, alive(g).filter((i) => isP(i, isWolf)))}</div>
        <PlayerPicker g={g} value={nd.victim} onChange={(v) => setNd({ victim: v, infect: false })} filter={prey} />
        {ur != null && !g.infectUsed && nd.victim != null && (
          <Section>
            <Row last>
              <span style={{ fontSize: 22 }}>🧛</span>
              <div style={{ flex: 1 }}><div>Urwolf infiziert {g.players[nd.victim].name}</div><div style={{ color: C.dim, fontSize: 13 }}>Statt zu sterben wird das Opfer heimlich zum Werwolf (einmal pro Spiel)</div></div>
              <Toggle on={!!nd.infect} onChange={(on) => setNd({ infect: on })} />
            </Row>
          </Section>
        )}
        {nd.infect && <Note>Sag dem Opfer später heimlich (Schulter antippen), dass es ab jetzt mit den Werwölfen aufwacht.</Note>}
        {hasRole(g, "girl") && <Note>👧 Das Mädchen darf jetzt heimlich blinzeln.</Note>}
      </>
    );
  } else if (kind === "whitewolf") {
    body = <PlayerPicker g={g} value={nd.whiteVictim} onChange={(v) => setNd({ whiteVictim: v })} filter={(i) => i !== who && isP(i, isWolf)} />;
  } else if (kind === "bigwolf") {
    const prey = (i) => !isP(i, isWolf) && i !== nd.victim;
    ready = nd.bigVictim != null || candidates(g, prey).length === 0;
    body = <PlayerPicker g={g} value={nd.bigVictim} onChange={(v) => setNd({ bigVictim: v })} filter={prey} />;
  } else if (kind === "witch") {
    const victims = [nd.victim, nd.bigVictim].filter((v) => v != null && !(nd.infect && v === nd.victim));
    body = (
      <>
        <Label>Heiltrank</Label>
        {!g.potions.heal ? <div style={{ color: C.dim, margin: "0 6px 18px" }}>Schon verbraucht</div>
          : victims.length === 0 ? <div style={{ color: C.dim, margin: "0 6px 18px" }}>Kein Opfer heute Nacht</div>
          : <div style={{ marginBottom: 18 }}><div style={{ color: C.dim, margin: "0 6px 8px" }}>Opfer: {nameList(g, victims)} – antippen zum Retten</div>
              <PlayerPicker g={g} value={nd.heal} onChange={(v) => setNd({ heal: v })} filter={(i) => victims.includes(i)} /></div>}
        <Label>Gifttrank</Label>
        {g.potions.poison
          ? <PlayerPicker g={g} value={nd.poison} onChange={(x) => setNd({ poison: x })} filter={(i) => i !== who} />
          : <div style={{ color: C.dim, margin: "0 6px" }}>Schon verbraucht</div>}
        <Note>Nichts antippen = Trank nicht benutzen.</Note>
      </>
    );
  } else if (kind === "piper") {
    const free = (i) => i !== who && !g.players[i].charmed;
    const need = Math.min(2, candidates(g, free).length);
    ready = (nd.charm || []).length === need;
    const all = alive(g).filter((i) => g.players[i].charmed || (nd.charm || []).includes(i));
    body = (
      <>
        <PlayerPicker g={g} value={nd.charm || []} max={2} onChange={(v) => setNd({ charm: v })} filter={free} mark={(i) => (g.players[i].charmed ? "🎶" : null)} />
        {ready && all.length > 0 && <Note>Der Flötenspieler schläft ein. Tippe {nameList(g, all)} an – alle Verzauberten öffnen kurz die Augen, erkennen sich und schlafen wieder ein.</Note>}
      </>
    );
  } else if (kind === "raven") {
    body = <PlayerPicker g={g} value={nd.raven} onChange={(v) => setNd({ raven: v })} />;
  }

  const next = () => {
    let n = g;
    // Entscheidungen der ersten Nacht sofort übernehmen, damit spätere Schritte sie kennen
    if (kind === "amor" && nd.lovers) n = { ...n, players: n.players.map((p, i) => ({ ...p, lover: nd.lovers.includes(i) })) };
    if (kind === "wildchild" && who != null) n = { ...n, players: n.players.map((p, i) => (i === who ? { ...p, model: nd.model } : p)) };
    if (kind === "wolfdog" && who != null) n = { ...n, players: n.players.map((p, i) => (i === who ? { ...p, orig: "wolfdog", role: nd.dog } : p)) };
    if (g.step < g.steps.length - 1) return update({ ...n, step: g.step + 1 });
    update(finishNight(n));
  };
  const back = () => update({ ...g, step: g.step - 1 });
  const lastStep = g.step === g.steps.length - 1;

  return (
    <div style={page} className="pop" key={g.step}>
      <div style={{ textAlign: "center", color: C.dim, marginTop: 6 }}>🌙 Nacht {g.night} · Schritt {g.step + 1} von {g.steps.length}</div>
      <div style={{ textAlign: "center", margin: "10px 0 16px" }}>
        <div style={{ fontSize: 56 }}>{r.emoji}</div>
        <div style={{ fontSize: 26, fontWeight: 700 }}>{s.title}</div>
      </div>
      {g.step === 0 && <Say>Es wird Nacht im Dorf. Alle schließen die Augen.</Say>}
      <Say>{s.say}</Say>
      {body}
      <BottomBar hint={!ready ? "Bitte erst auswählen" : null}>
        {g.step > 0 && <BigButton color={C.card2} style={{ flex: "0 0 90px" }} onClick={back}>‹</BigButton>}
        <BigButton disabled={!ready} onClick={next}>{lastStep ? "Morgen werden lassen ☀️" : "Einschlafen lassen ›"}</BigButton>
      </BottomBar>
    </div>
  );
}

// ── Todesmeldungen, Jäger & Hauptmann ─────────────────────────────────────────
function roleText(p) {
  let t = `${ROLES[p.role].emoji} ${ROLES[p.role].name}`;
  if (p.orig) t += ` (früher ${ROLES[p.orig].name})`;
  if (p.infected) t += " – infiziert";
  return t;
}

function Announce({ g, update }) {
  const [target, setTarget] = useState(null);
  const a = g.announce;
  const hunter = g.pendingHunters[0];
  const w = winner(g);
  const judge = firstAlive(g, "judge");
  const canJudge = a.fromVote && !w && judge != null && !g.judgeUsed && !g.powersLost;

  const proceed = () => {
    if (w) return update({ ...g, phase: "end", winner: w, announce: null });
    if (a.next === "day") return update({ ...g, phase: "day", announce: null });
    return update(startNight({ ...g, raven: null }));
  };
  const shoot = (t) => {
    const n = applyDeaths({ ...g, pendingHunters: g.pendingHunters.slice(1) }, t == null ? [] : [t]);
    setTarget(null);
    update({ ...n, announce: { ...a, dead: [...a.dead, ...n._dead] },
      log: t == null ? n.log : [...n.log, `🏹 ${g.players[hunter].name} erschießt ${nameList(g, n._dead)}`] });
  };
  const successor = (t) => {
    setTarget(null);
    update({ ...g, captain: t, pendingCaptain: false, log: t == null ? g.log : [...g.log, `🎖️ ${g.players[t].name} wird Hauptmann`] });
  };

  let action;
  if (hunter != null) {
    action = (
      <>
        <Say>{g.players[hunter].name} war der Jäger und reißt mit letzter Kraft das Gewehr hoch. Auf wen schießt er?</Say>
        <PlayerPicker g={g} value={target} onChange={setTarget} />
        <BottomBar>
          <BigButton color={C.card2} onClick={() => shoot(null)}>Kein Schuss</BigButton>
          <BigButton disabled={target == null} onClick={() => shoot(target)}>🏹 Schießen</BigButton>
        </BottomBar>
      </>
    );
  } else if (g.pendingCaptain && !w && alive(g).length) {
    action = (
      <>
        <Say>Der Hauptmann {g.players[g.captain].name} ist tot. Mit letztem Atem ernennt er einen Nachfolger.</Say>
        <PlayerPicker g={g} value={target} onChange={setTarget} />
        <BottomBar><BigButton disabled={target == null} onClick={() => successor(target)}>🎖️ Ernennen</BigButton></BottomBar>
      </>
    );
  } else {
    action = (
      <BottomBar>
        {canJudge && <BigButton color={C.card2} onClick={() => update({ ...g, phase: "day", judgeUsed: true, announce: null, secondVote: true })}>⚖️ 2. Abstimmung</BigButton>}
        <BigButton onClick={proceed}>{w ? "Spielende 🏆" : a.next === "day" ? "Zur Abstimmung ☀️" : "Es wird Nacht 🌙"}</BigButton>
      </BottomBar>
    );
  }

  return (
    <div style={page} className="pop">
      <TopBar title={a.title} />
      {a.dead.length === 0 ? (
        <div style={{ textAlign: "center", padding: "30px 10px", fontSize: 18, lineHeight: 1.45 }}><div style={{ fontSize: 60 }}>🌅</div>{a.empty}</div>
      ) : (
        <Section title="Gestorben">
          {a.dead.map((i, k) => {
            const p = g.players[i];
            return (
              <Row key={i} last={k === a.dead.length - 1}>
                <span style={{ fontSize: 24 }}>🪦</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 18, fontWeight: 600 }}>{p.name}{p.lover ? " 💘" : ""}{i === g.captain ? " 🎖️" : ""}</div>
                  {g.showRoles && <div style={{ color: isWolf(p) ? C.bad : C.dim, fontSize: 14 }}>war {roleText(p)}</div>}
                </div>
              </Row>
            );
          })}
        </Section>
      )}
      {a.dead.some((i) => g.players[i].lover) && <Note>💔 Wer verliebt war, ist dem Partner aus Kummer gefolgt.</Note>}
      {(a.notes || []).map((t, i) => <Note key={i} color={C.text}>{t}</Note>)}
      {g.powersLost && a.dead.some((i) => g.players[i].role === "elder") && <Note color={C.bad}>👴 Der Dorfälteste wurde nicht von Werwölfen getötet – alle Dorfbewohner verlieren ihre Sonderfähigkeiten!</Note>}
      {canJudge && <Note>⚖️ Der Stotternde Richter kann jetzt (mit seinem geheimen Zeichen) eine zweite Abstimmung verlangen.</Note>}
      <div style={{ height: 18 }} />
      {action}
    </div>
  );
}

// ── Tag ───────────────────────────────────────────────────────────────────────
function Day({ g, update }) {
  const [pick, setPick] = useState(null);
  const [confirm, setConfirm] = useState(false);
  const goat = firstAlive(g, "scapegoat");
  const needCaptain = g.captainOn && g.captain == null;
  const mark = (i) => [i === g.captain && "🎖️", i === g.raven && "🐦‍⬛ +2", g.players[i].revealed && g.players[i].role === "idiot" && "🤪"].filter(Boolean).join(" ") || null;

  const vote = (id, tie) => {
    const target = tie ? goat ?? null : id;
    const p = target != null ? g.players[target] : null;
    const label = g.secondVote ? `2. Urteil an Tag ${g.night}` : `Urteil an Tag ${g.night}`;
    const base = { ...g, secondVote: false, raven: null, phase: "announce" };
    if (p && !p.revealed && ((p.role === "idiot" && !g.powersLost) || p.role === "prince")) {
      const note = p.role === "idiot" ? `🤪 ${p.name} ist der Dorfdepp – bleibt am Leben, darf aber ab jetzt nicht mehr abstimmen.` : `🤴 ${p.name} ist der Prinz und wird begnadigt.`;
      return update({ ...base, players: g.players.map((q, i) => (i === target ? { ...q, revealed: true } : q)), log: [...g.log, `Tag ${g.night}: ${p.name} aufgedeckt`],
        announce: { title: `⚖️ ${label}`, dead: [], notes: [note], empty: "Niemand stirbt.", next: "night", fromVote: true } });
    }
    const n = applyDeaths(base, target == null ? [] : [target]);
    const notes = tie && goat != null ? [`🐐 Gleichstand – der Sündenbock ${g.players[goat].name} muss sterben.`] : [];
    update({ ...n, log: [...g.log, `Tag ${g.night}: ${target == null ? "niemand verurteilt" : "† " + nameList(g, n._dead)}`],
      announce: { title: `⚖️ ${label}`, dead: n._dead, notes, empty: "Das Dorf konnte sich nicht einigen – niemand wird verurteilt.", next: "night", fromVote: true } });
  };

  if (needCaptain) {
    return (
      <div style={page} className="pop">
        <div style={{ textAlign: "center", margin: "6px 0 16px" }}>
          <div style={{ fontSize: 56 }}>🎖️</div>
          <div style={{ fontSize: 26, fontWeight: 700 }}>Hauptmann-Wahl</div>
        </div>
        <Say>Bevor ihr abstimmt, wählt das Dorf einen Hauptmann. Seine Stimme zählt doppelt.</Say>
        <PlayerPicker g={g} value={pick} onChange={setPick} />
        <BottomBar><BigButton disabled={pick == null} onClick={() => { update({ ...g, captain: pick, log: [...g.log, `🎖️ ${g.players[pick].name} wird Hauptmann`] }); setPick(null); }}>Zum Hauptmann wählen</BigButton></BottomBar>
      </div>
    );
  }

  const idiots = alive(g).filter((i) => g.players[i].revealed && g.players[i].role === "idiot");
  return (
    <div style={page} className="pop">
      <div style={{ textAlign: "center", margin: "6px 0 16px" }}>
        <div style={{ fontSize: 56 }}>☀️</div>
        <div style={{ fontSize: 26, fontWeight: 700 }}>Tag {g.night}{g.secondVote ? " · 2. Abstimmung" : ""}</div>
        <div style={{ color: C.dim }}>{alive(g).length} Spieler leben noch</div>
      </div>
      <Say>Diskutiert, wer ein Werwolf sein könnte – und stimmt dann ab. Wen schickt das Dorf an den Galgen?</Say>
      <PlayerPicker g={g} value={pick} onChange={setPick} mark={mark} />
      {g.captain != null && g.players[g.captain].alive && <Note>🎖️ Die Stimme von {g.players[g.captain].name} zählt doppelt.</Note>}
      {g.raven != null && g.players[g.raven].alive && <Note>🐦‍⬛ {g.players[g.raven].name} hat 2 Stimmen mehr gegen sich.</Note>}
      {idiots.length > 0 && <Note>🤪 {nameList(g, idiots)} darf nicht abstimmen.</Note>}
      <BottomBar>
        <BigButton color={C.card2} onClick={() => vote(null)}>Niemand</BigButton>
        {goat != null && <BigButton color={C.card2} onClick={() => vote(null, true)}>Gleichstand</BigButton>}
        <BigButton disabled={pick == null} onClick={() => setConfirm(true)}>Verurteilen</BigButton>
      </BottomBar>
      {confirm && (
        <Sheet title={`${g.players[pick].name} verurteilen?`} onClose={() => setConfirm(false)}>
          <div style={{ display: "flex", gap: 10 }}>
            <BigButton color={C.card2} onClick={() => setConfirm(false)}>Abbrechen</BigButton>
            <BigButton color={C.wolf} onClick={() => { setConfirm(false); vote(pick); }}>Ja, verurteilen</BigButton>
          </div>
        </Sheet>
      )}
    </div>
  );
}

// ── Spielende ─────────────────────────────────────────────────────────────────
function End({ g, onNew, onHome }) {
  const w = WIN[g.winner];
  return (
    <div style={page} className="pop">
      <div style={{ textAlign: "center", margin: "20px 0 24px" }}>
        <div style={{ fontSize: 80 }}>{w.emoji}</div>
        <div style={{ fontSize: 28, fontWeight: 700 }}>{w.title}</div>
        <div style={{ color: C.dim, marginTop: 6 }}>{w.text}</div>
      </div>
      <Overview g={g} />
      <BottomBar>
        <BigButton color={C.card2} onClick={onHome}>Fertig</BigButton>
        <BigButton onClick={onNew}>Nochmal spielen</BigButton>
      </BottomBar>
    </div>
  );
}

// Alle Rollen + Verlauf (nur für den Spielleiter)
function Overview({ g }) {
  const [info, setInfo] = useState(null);
  const status = [
    hasRole(g, "witch") && `🧪 Heiltrank ${g.potions.heal ? "✓" : "✗"} · Gifttrank ${g.potions.poison ? "✓" : "✗"}`,
    hasRole(g, "elder") && `👴 Dorfältester: ${g.elderHit ? "erstes Leben verbraucht" : "hat noch ein Extraleben"}`,
    g.powersLost && "⚠️ Dorfbewohner haben ihre Kräfte verloren",
    hasRole(g, "fox") && g.foxLost && "🦊 Der Fuchs hat seine Kraft verloren",
    hasRole(g, "urwolf") && `🧛 Infektion ${g.infectUsed ? "verbraucht" : "noch verfügbar"}`,
    hasRole(g, "judge") && `⚖️ Zweite Abstimmung ${g.judgeUsed ? "verbraucht" : "noch verfügbar"}`,
    g.delayed.length > 0 && `⏳ Stirbt in der nächsten Nacht: ${nameList(g, g.delayed)}`,
  ].filter(Boolean);
  return (
    <>
      <Section title="Rollen">
        {g.players.map((p, i) => (
          <Row key={i} last={i === g.players.length - 1} onClick={() => setInfo(i)}>
            <span style={{ fontSize: 22, opacity: p.alive ? 1 : 0.4 }}>{ROLES[p.role].emoji}</span>
            <div style={{ flex: 1, opacity: p.alive ? 1 : 0.5 }}>
              <div style={{ fontWeight: 600, textDecoration: p.alive ? "none" : "line-through" }}>
                {p.name}{p.lover ? " 💘" : ""}{p.charmed ? " 🎶" : ""}{i === g.captain ? " 🎖️" : ""}{p.revealed ? " 👁️" : ""}
              </div>
              <div style={{ color: isWolf(p) ? C.bad : C.dim, fontSize: 14 }}>{roleText(p)}{p.role === "wildchild" && p.model != null ? ` – Vorbild: ${g.players[p.model].name}` : ""} <span style={{ color: C.dim }}>ⓘ</span></div>
            </div>
            <span style={{ color: p.alive ? C.good : C.dim, fontSize: 14 }}>{p.alive ? "lebt" : "tot"}</span>
          </Row>
        ))}
      </Section>
      {status.map((t, i) => <div key={i} style={{ color: C.dim, margin: "-8px 6px 14px", fontSize: 14 }}>{t}</div>)}
      {g.log.length > 0 && (
        <Section title="Verlauf">
          {g.log.map((l, i) => <Row key={i} last={i === g.log.length - 1}><span style={{ fontSize: 15 }}>{l}</span></Row>)}
        </Section>
      )}
      {info != null && <PlayerInfo g={g} i={info} onClose={() => setInfo(null)} />}
    </>
  );
}

// Rollenkarte eines Spielers für den Spielleiter (bei Rollenwechsel auch die ursprüngliche Karte)
function PlayerInfo({ g, i, onClose }) {
  const p = g.players[i];
  const notes = [
    !p.alive && "🪦 Ist tot",
    p.lover && `💘 Verliebt in ${nameList(g, g.players.map((q, j) => j).filter((j) => j !== i && g.players[j].lover))}`,
    p.charmed && "🎶 Vom Flötenspieler verzaubert",
    p.infected && "🧛 Vom Urwolf infiziert – wacht mit den Werwölfen auf",
    i === g.captain && "🎖️ Hauptmann – Stimme zählt doppelt",
    p.revealed && "👁️ Karte wurde schon aufgedeckt",
    p.role === "wildchild" && p.model != null && `🧒 Vorbild: ${g.players[p.model].name}`,
  ].filter(Boolean);
  return (
    <Sheet title={p.name} onClose={onClose}>
      <RoleCard role={p.role} small />
      {p.orig && (
        <>
          <div style={{ color: C.dim, textAlign: "center", margin: "14px 0 8px" }}>Ursprünglich war {p.name}:</div>
          <RoleCard role={p.orig} small />
        </>
      )}
      {notes.map((t, k) => <Note key={k} color={C.text}>{t}</Note>)}
      <div style={{ display: "flex", marginTop: 16 }}><BigButton color={C.card2} onClick={onClose}>Zurück</BigButton></div>
    </Sheet>
  );
}

// ── Spiel ─────────────────────────────────────────────────────────────────────
function Game({ g, update, onHome, onNew }) {
  const [sheet, setSheet] = useState(null);
  if (g.phase === "end") return <End g={g} onNew={onNew} onHome={onHome} />;

  let screen;
  if (g.phase === "reveal") screen = <Reveal g={g} update={update} />;
  else if (g.phase === "night") screen = <Night g={g} update={update} />;
  else if (g.phase === "announce") screen = <Announce g={g} update={update} />;
  else screen = <Day g={g} update={update} />;

  return (
    <>
      {/* Spielleiter-Übersicht – beim Kartenansehen ausgeblendet, damit niemand spickt */}
      <div style={{ position: "fixed", top: "calc(env(safe-area-inset-top) + 12px)", left: 0, right: 0, zIndex: 4, pointerEvents: "none" }}>
        <div style={{ maxWidth: 560, margin: "0 auto", padding: "0 16px", display: "flex", justifyContent: "space-between" }}>
          <span style={{ pointerEvents: "auto" }}><IconBtn label="Werwolf-Start" onClick={onHome}>🏠</IconBtn></span>
          {g.phase !== "reveal" && <span style={{ pointerEvents: "auto" }}><IconBtn label="Spielleiter-Übersicht" onClick={() => setSheet("peek")}>📜</IconBtn></span>}
        </div>
      </div>
      <div style={{ paddingTop: 44 }}>{screen}</div>
      {sheet === "peek" && (
        <Sheet title="📜 Spielleiter-Übersicht" onClose={() => setSheet(null)}>
          <div style={{ color: C.bad, fontSize: 14, textAlign: "center", marginBottom: 14 }}>Nur für den Spielleiter – niemand sonst darf hinschauen!</div>
          <Overview g={g} />
          <div style={{ display: "flex", gap: 10 }}>
            <BigButton color={C.card2} onClick={() => setSheet(null)}>Schließen</BigButton>
            <BigButton color={C.wolf} onClick={() => setSheet("quit")}>Spiel beenden</BigButton>
          </div>
        </Sheet>
      )}
      {sheet === "quit" && (
        <Sheet title="Spiel wirklich beenden?" onClose={() => setSheet(null)}>
          <div style={{ color: C.dim, textAlign: "center", marginBottom: 14 }}>Das laufende Spiel wird gelöscht.</div>
          <div style={{ display: "flex", gap: 10 }}>
            <BigButton color={C.card2} onClick={() => setSheet(null)}>Abbrechen</BigButton>
            <BigButton color={C.wolf} onClick={() => { setSheet(null); update(null); onHome(); }}>Beenden</BigButton>
          </div>
        </Sheet>
      )}
    </>
  );
}

function App() {
  const [state, setState] = useState(loadState);
  const [view, setView] = useState(() => (state.game && !state.game.winner ? "game" : "home"));

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => { window.scrollTo(0, 0); }, [view, state.game && state.game.phase, state.game && state.game.step]);

  const update = (g) => setState((s) => ({ ...s, game: g }));

  if (view === "setup")
    return <Setup state={state} onCancel={() => setView("home")}
      onStart={(names, roles, o) => {
        setState((s) => ({ ...s, names, showRoles: o.showRoles, captain: o.captain, roles, auto: o.auto, game: newGame(names, roles, o) }));
        setView("game");
      }} />;

  if (view === "game" && state.game)
    return <Game g={state.game} update={update} onHome={() => setView("home")} onNew={() => setView("setup")} />;

  return <Home state={state} onContinue={() => setView("game")} onNew={() => setView("setup")} />;
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
