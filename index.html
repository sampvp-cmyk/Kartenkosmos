<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kartenkosmos" />
  <meta name="theme-color" content="#0f1024" />
  <title>Kartenkosmos</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0f1024; }
    body { color: #fff; font-family: 'Fredoka', 'Trebuchet MS', sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
    .stars { position: fixed; inset: 0; pointer-events: none; background-image:
      radial-gradient(1px 1px at 10% 12%, #fff8, transparent), radial-gradient(1px 1px at 30% 6%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, #fff9, transparent), radial-gradient(1px 1px at 72% 8%, #fff6, transparent),
      radial-gradient(1px 1px at 88% 18%, #fff8, transparent), radial-gradient(1px 1px at 20% 48%, #fff4, transparent),
      radial-gradient(1px 1px at 80% 60%, #fff5, transparent), radial-gradient(1.5px 1.5px at 45% 80%, #fff5, transparent); }
    .glow { position: fixed; left: 50%; top: -30vh; width: 140vw; height: 70vh; transform: translateX(-50%); pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, rgba(124, 92, 255, 0.28) 0%, rgba(124, 92, 255, 0.08) 45%, transparent 70%); }
    main { position: relative; max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 40px) 16px calc(env(safe-area-inset-bottom) + 32px); }
    h1 { text-align: center; font-size: 32px; font-weight: 700; }
    .sub { text-align: center; color: #a5a8d6; margin: 6px 0 32px; }
    .tile { display: flex; align-items: center; gap: 16px; padding: 16px; margin-bottom: 14px; border-radius: 22px; text-decoration: none; color: #fff;
      background: #1b1c3a; border: 1px solid #ffffff1a; transition: transform .1s, border-color .2s; }
    .tile:active { transform: scale(0.98); }
    .tile:hover { border-color: #8b6cff88; }
    .tile img { width: 76px; height: 76px; border-radius: 18px; flex-shrink: 0; box-shadow: 0 4px 14px #0006; }
    .tile .name { font-size: 22px; font-weight: 600; }
    .tile .desc { color: #a5a8d6; font-size: 14px; margin-top: 2px; line-height: 1.35; }
    .tile .arrow { margin-left: auto; color: #a5a8d6; font-size: 26px; }
  </style>
</head>
<body>
  <div class="stars"></div><div class="glow"></div>
  <main>
    <h1>🪐 Kartenkosmos</h1>
    <div class="sub">Welcher Planet wird heute bespielt?</div>
    <a class="tile" href="wizard/">
      <img src="wizard/icon-192.png" alt="" />
      <div><div class="name">Wizard Block</div><div class="desc">Punkteblock für Wizard – Ansagen, Stiche, Rangliste</div></div>
      <span class="arrow">›</span>
    </a>
    <a class="tile" href="arschmallows/">
      <img src="arschmallows/icon-192.png" alt="" />
      <div><div class="name">Arschmallows</div><div class="desc">Merk-Helfer für das Kartenspiel Arschmallows</div></div>
      <span class="arrow">›</span>
    </a>
    <a class="tile" href="kniffel/">
      <img src="kniffel/icon-192.png" alt="" />
      <div><div class="name">Kniffel Block</div><div class="desc">Punkteblock für Kniffel – mit Würfeln in der App</div></div>
      <span class="arrow">›</span>
    </a>
  </main>
</body>
</html>
