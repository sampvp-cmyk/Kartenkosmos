<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kartenkosmos" />
  <meta name="theme-color" content="#14101f" />
  <title>Kniffel Block</title>
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #14101f; }
    body { color: #fff; font-family: 'Fredoka', 'Trebuchet MS', sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
    button, input, select { font-family: inherit; }
    input { -webkit-user-select: text; user-select: text; }
    .glow { position: fixed; left: 50%; top: -30vh; width: 140vw; height: 70vh; transform: translateX(-50%); pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(239, 68, 68, 0.25) 0%, rgba(239, 68, 68, 0.07) 45%, transparent 70%); }
    #app { position: relative; z-index: 1; }
    /* nur Deckkraft: ein transform würde die fixierte Leiste unten während der Animation verschieben */
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    .pop { animation: pop 0.2s ease; }
    @keyframes shake { 0% { transform: rotate(0); } 25% { transform: rotate(-14deg) scale(.92); } 50% { transform: rotate(10deg); } 75% { transform: rotate(-6deg) scale(1.04); } 100% { transform: rotate(0); } }
    .shake { animation: shake 0.45s ease; }
    .sheet-table { border-collapse: separate; border-spacing: 0; font-size: 15px; width: 100%; }
    .sheet-table th, .sheet-table td { padding: 0 6px; height: 42px; text-align: center; border-bottom: 1px solid #ffffff14; white-space: nowrap; }
    .sheet-table th { position: sticky; top: 0; background: #221b33; font-weight: 600; z-index: 2; }
    .sheet-table td:first-child, .sheet-table th:first-child { position: sticky; left: 0; background: #221b33; z-index: 1; text-align: left; }
    .sheet-table th:first-child { z-index: 3; }
  </style>
</head>
<body>
<div class="glow"></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">

const { useState, useEffect } = React;

const STORAGE_KEY = "kniffel-block-2-v1"; // eigener Speicher, getrennt vom ursprünglichen Kniffel Block

const C = {
  card: "#221b33", card2: "#2e2545", line: "#ffffff1a", text: "#fff", dim: "#b3a9cc",
  accent: "#ef4444", gold: "#ffcc4d", good: "#34d399", bad: "#f87171",
};

// ── Kniffel-Regeln ────────────────────────────────────────────────────────────
const count = (dice, v) => dice.filter((d) => d === v).length;
const sum = (dice) => dice.reduce((a, b) => a + b, 0);
const counts = (dice) => [1, 2, 3, 4, 5, 6].map((v) => count(dice, v));
const hasRun = (dice, len) => {
  const set = new Set(dice);
  for (let s = 1; s + len - 1 <= 6; s++) if (Array.from({ length: len }, (_, i) => s + i).every((v) => set.has(v))) return true;
  return false;
};
const isKniffel = (dice) => dice.length === 5 && new Set(dice).size === 1;

// fixed: Feld hat nur einen möglichen Wert außer 0 (Full House, Straßen, Kniffel)
const UPPER = [1, 2, 3, 4, 5, 6].map((v) => ({
  id: `n${v}`, name: ["Einser", "Zweier", "Dreier", "Vierer", "Fünfer", "Sechser"][v - 1], short: `${v}er`, upper: true,
  desc: `Nur ${v}er zählen`, options: [0, 1, 2, 3, 4, 5].map((k) => k * v),
  score: (d) => count(d, v) * v,
}));
const LOWER = [
  { id: "dp", name: "Dreierpasch", short: "3er-Pasch", desc: "Alle Augen zählen", options: "free",
    score: (d) => (counts(d).some((c) => c >= 3) ? sum(d) : 0) },
  { id: "vp", name: "Viererpasch", short: "4er-Pasch", desc: "Alle Augen zählen", options: "free",
    score: (d) => (counts(d).some((c) => c >= 4) ? sum(d) : 0) },
  { id: "fh", name: "Full House", short: "Full House", desc: "25 Punkte", fixed: 25,
    score: (d) => { const c = counts(d); return (c.includes(3) && c.includes(2)) || isKniffel(d) ? 25 : 0; } },
  { id: "ks", name: "Kleine Straße", short: "Kl. Straße", desc: "30 Punkte", fixed: 30,
    score: (d) => (hasRun(d, 4) ? 30 : 0) },
  { id: "gs", name: "Große Straße", short: "Gr. Straße", desc: "40 Punkte", fixed: 40,
    score: (d) => (hasRun(d, 5) ? 40 : 0) },
  { id: "kn", name: "Kniffel", short: "Kniffel", desc: "50 Punkte", fixed: 50,
    score: (d) => (isKniffel(d) ? 50 : 0) },
  { id: "ch", name: "Chance", short: "Chance", desc: "Alle Augen zählen", options: "free",
    score: (d) => sum(d) },
];
const FIELDS = [...UPPER, ...LOWER];
const FIELD = Object.fromEntries(FIELDS.map((f) => [f.id, f]));
const BONUS_LIMIT = 63;
const BONUS = 35;

function playerScore(sheet, extraKniffel) {
  const val = (id) => (sheet[id] == null ? 0 : sheet[id]);
  const upper = UPPER.reduce((a, f) => a + val(f.id), 0);
  const bonus = upper >= BONUS_LIMIT ? BONUS : 0;
  const lower = LOWER.reduce((a, f) => a + val(f.id), 0);
  const extra = extraKniffel ? (sheet.extra || 0) * 50 : 0;
  return { upper, bonus, upperTotal: upper + bonus, lower: lower + extra, extra, total: upper + bonus + lower + extra };
}

const filledCount = (sheet) => FIELDS.filter((f) => sheet[f.id] != null).length;
const turnsDone = (game) => game.sheets.reduce((a, s) => a + filledCount(s), 0);
const totalTurns = (game) => game.players.length * FIELDS.length;
const isFinished = (game) => turnsDone(game) >= totalTurns(game);
const roundNo = (game) => Math.min(13, Math.min(...game.sheets.map(filledCount)) + 1);
// Reihum: wer am wenigsten Felder hat, ist dran (bei Gleichstand der Erste in der Reihe)
function currentPlayer(game) {
  let best = 0;
  game.sheets.forEach((s, p) => { if (filledCount(s) < filledCount(game.sheets[best])) best = p; });
  return best;
}

function ranking(game) {
  const order = game.players.map((name, p) => ({ name, p, score: playerScore(game.sheets[p], game.extraKniffel).total })).sort((a, b) => b.score - a.score);
  const distinct = [...new Set(order.map((o) => o.score))];
  return order.map((o) => ({ ...o, place: distinct.indexOf(o.score) + 1 }));
}
const medal = (place) => ["🥇", "🥈", "🥉"][place - 1] || `${place}.`;
const formatDate = (ts) => new Date(ts).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });

// ── Speicher ──────────────────────────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { games: [] };
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}
// Browser bitten, den Speicher nicht automatisch zu leeren (wichtig für die Home-Bildschirm-App)
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// ── UI-Bausteine ──────────────────────────────────────────────────────────────
const page = { maxWidth: 560, margin: "0 auto", padding: "calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)" };

function TopBar({ left, title, right }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", alignItems: "center", minHeight: 48, marginBottom: 12 }}>
      <div style={{ justifySelf: "start" }}>{left}</div>
      <div style={{ fontSize: 19, fontWeight: 600, textAlign: "center", maxWidth: "52vw", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</div>
      <div style={{ justifySelf: "end" }}>{right}</div>
    </div>
  );
}

function IconBtn({ children, onClick, label }) {
  return (
    <button aria-label={label} onClick={onClick} style={{ minWidth: 40, height: 40, padding: "0 12px", borderRadius: 20, border: `1px solid ${C.line}`, background: C.card, color: C.text, fontSize: 16, cursor: "pointer" }}>
      {children}
    </button>
  );
}

function Section({ title, children, footer }) {
  return (
    <div style={{ marginBottom: 20 }}>
      {title && <div style={{ color: C.dim, fontSize: 14, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.6, margin: "0 6px 6px" }}>{title}</div>}
      <div style={{ background: C.card, borderRadius: 16, border: `1px solid ${C.line}`, overflow: "hidden" }}>{children}</div>
      {footer && <div style={{ color: C.dim, fontSize: 13, margin: "8px 6px 0", lineHeight: 1.4 }}>{footer}</div>}
    </div>
  );
}

function Row({ children, onClick, last }) {
  return (
    <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 10, minHeight: 50, padding: "8px 14px", borderBottom: last ? "none" : `1px solid ${C.line}`, cursor: onClick ? "pointer" : "default" }}>
      {children}
    </div>
  );
}

function BigButton({ children, onClick, disabled, color = C.accent, style }) {
  return (
    <button onClick={disabled ? undefined : onClick} disabled={disabled}
      style={{ flex: 1, height: 50, borderRadius: 14, border: "none", background: disabled ? "#3a3150" : color, color: disabled ? "#8a80a6" : "#fff", fontSize: 17, fontWeight: 600, cursor: disabled ? "default" : "pointer", ...style }}>
      {children}
    </button>
  );
}

function BottomBar({ children, hint, hintColor }) {
  return (
    <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 5, background: "linear-gradient(transparent, #14101f 30%)", padding: "24px 16px calc(env(safe-area-inset-bottom) + 14px)" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>
        {hint && <div style={{ textAlign: "center", fontSize: 14, marginBottom: 8, color: hintColor || C.dim, fontWeight: 500 }}>{hint}</div>}
        <div style={{ display: "flex", gap: 10 }}>{children}</div>
      </div>
    </div>
  );
}

function Segmented({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 4, background: C.card, border: `1px solid ${C.line}`, borderRadius: 12, padding: 4 }}>
      {options.map((o) => (
        <button key={o.id} onClick={() => onChange(o.id)}
          style={{ flex: 1, minWidth: 0, height: 36, borderRadius: 9, border: "none", fontSize: 14, fontWeight: 500, cursor: "pointer", padding: "0 4px",
            background: value === o.id ? C.accent : "transparent", color: value === o.id ? "#fff" : C.dim }}>
          {o.name}
        </button>
      ))}
    </div>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 20, background: "#0008", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div className="pop" onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 560, background: "#1b1529", borderRadius: "20px 20px 0 0", border: `1px solid ${C.line}`, padding: "18px 16px calc(env(safe-area-inset-bottom) + 18px)", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ fontSize: 18, fontWeight: 600, textAlign: "center", marginBottom: 14 }}>{title}</div>
        {children}
      </div>
    </div>
  );
}

function Toggle({ on, onChange }) {
  return (
    <button aria-pressed={on} onClick={() => onChange(!on)}
      style={{ width: 52, height: 32, borderRadius: 16, border: "none", background: on ? C.good : "#4a4163", position: "relative", cursor: "pointer", flexShrink: 0, transition: "background .15s" }}>
      <span style={{ position: "absolute", top: 3, left: on ? 23 : 3, width: 26, height: 26, borderRadius: 13, background: "#fff", transition: "left .15s" }} />
    </button>
  );
}

// Würfel mit Augen (3×3-Raster)
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function Die({ value, held, size = 54, onClick, rolling }) {
  return (
    <button onClick={onClick} aria-label={value ? `Würfel ${value}${held ? ", gehalten" : ""}` : "Würfel"} className={rolling ? "shake" : ""}
      style={{ width: size, height: size, borderRadius: size * 0.2, border: held ? `3px solid ${C.gold}` : "3px solid transparent", background: value ? "#fff" : "#ffffff22",
        padding: size * 0.12, display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gridTemplateRows: "repeat(3, 1fr)", cursor: onClick ? "pointer" : "default",
        boxShadow: held ? `0 0 0 3px ${C.gold}44` : "0 3px 0 #00000055", transform: held ? "translateY(-6px)" : "none", transition: "transform .15s" }}>
      {Array.from({ length: 9 }, (_, i) => (
        <span key={i} style={{ placeSelf: "center", width: size * 0.17, height: size * 0.17, borderRadius: "50%", background: value && PIPS[value].includes(i) ? "#1b1529" : "transparent" }} />
      ))}
    </button>
  );
}

// ── Spieleliste ───────────────────────────────────────────────────────────────
function GameList({ games, onOpen, onNew, onSettings }) {
  const sorted = [...games].sort((a, b) => b.created - a.created);
  return (
    <div style={page}>
      <TopBar left={<div style={{ display: "flex", gap: 8 }}><IconBtn label="Startmenü" onClick={() => { location.href = "../"; }}>🏠</IconBtn><IconBtn label="Einstellungen" onClick={onSettings}>⚙️</IconBtn></div>} title="🎲 Kniffel Block" right={<IconBtn label="Neues Spiel" onClick={onNew}>＋</IconBtn>} />
      {sorted.length === 0 && (
        <div style={{ textAlign: "center", padding: "60px 20px", color: C.dim }}>
          <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 18 }}>
            {[5, 5, 5, 5, 5].map((v, i) => <Die key={i} value={v} size={40} />)}
          </div>
          <div style={{ fontSize: 18, color: C.text, marginBottom: 6 }}>Noch keine Spiele</div>
          <div style={{ marginBottom: 24 }}>Leg ein neues Spiel an und los geht's.</div>
          <BigButton onClick={onNew} style={{ width: "100%", maxWidth: 260 }}>Neues Spiel</BigButton>
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 12 }}>
        {sorted.map((g) => {
          const fin = isFinished(g);
          const winners = fin ? ranking(g).filter((r) => r.place === 1).map((r) => r.name) : [];
          return (
            <button key={g.id} onClick={() => onOpen(g.id)}
              style={{ background: C.card, border: `1px solid ${fin ? "#ffcc4d44" : C.line}`, borderRadius: 18, padding: "14px 12px", color: C.text, cursor: "pointer", textAlign: "center", minHeight: 140, display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
              <div style={{ fontSize: 15, color: C.dim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.name}</div>
              <div style={{ fontSize: fin ? 19 : 22, fontWeight: 600, margin: "10px 0", lineHeight: 1.2 }}>
                {fin ? `🥇 ${winners.join(", ")}` : `Runde ${roundNo(g)} / 13`}
              </div>
              <div style={{ fontSize: 13, color: C.dim }}>{g.players.length} Spieler · {formatDate(g.created)}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── Neues Spiel & Einstellungen ───────────────────────────────────────────────
const DEFAULTS = { extraKniffel: true, dice: true, players: [] };
const textInput = { flex: 1, minWidth: 0, background: "transparent", border: "none", outline: "none", color: C.text, fontSize: 16, padding: "6px 0" };

function GameOptions({ opts, setOpts, children }) {
  const set = (patch) => setOpts({ ...opts, ...patch });
  return (
    <Section title="Allgemein" footer="Zusatz-Kniffel: Wer schon 50 Punkte im Kniffel-Feld hat, bekommt für jeden weiteren Kniffel 50 Bonuspunkte. Würfel in der App: Ihr könnt direkt im Block würfeln – ohne echte Würfel.">
      {children}
      <Row><span style={{ flex: 1 }}>Zusatz-Kniffel (+50)</span><Toggle on={opts.extraKniffel} onChange={(v) => set({ extraKniffel: v })} /></Row>
      <Row last><span style={{ flex: 1 }}>Würfel in der App</span><Toggle on={opts.dice} onChange={(v) => set({ dice: v })} /></Row>
    </Section>
  );
}

function PlayerRows({ players, setPlayers }) {
  const setPlayer = (i, v) => setPlayers(players.map((p, j) => (j === i ? v : p)));
  const move = (i, d) => { const n = [...players]; [n[i], n[i + d]] = [n[i + d], n[i]]; setPlayers(n); };
  const small = { width: 30, height: 30, borderRadius: 8, border: `1px solid ${C.line}`, background: "transparent", color: C.dim, fontSize: 14, cursor: "pointer" };
  return (
    <>
      {players.map((p, i) => (
        <Row key={i}>
          <button aria-label="Entfernen" onClick={() => setPlayers(players.filter((_, j) => j !== i))} style={{ width: 26, height: 26, borderRadius: 13, border: "none", background: C.bad, color: "#fff", fontSize: 18, lineHeight: "26px", cursor: "pointer", flexShrink: 0 }}>−</button>
          <input style={textInput} autoComplete="off" placeholder={`Spieler ${i + 1}`} value={p} onChange={(e) => setPlayer(i, e.target.value)} />
          <button aria-label="Nach oben" disabled={i === 0} onClick={() => move(i, -1)} style={{ ...small, opacity: i === 0 ? 0.3 : 1 }}>▲</button>
          <button aria-label="Nach unten" disabled={i === players.length - 1} onClick={() => move(i, 1)} style={{ ...small, opacity: i === players.length - 1 ? 0.3 : 1 }}>▼</button>
        </Row>
      ))}
      <Row onClick={() => setPlayers([...players, ""])} last>
        <span style={{ width: 26, height: 26, borderRadius: 13, background: C.good, color: "#fff", fontSize: 18, lineHeight: "26px", textAlign: "center" }}>+</span>
        <span style={{ color: C.good }}>Neuen Spieler hinzufügen</span>
      </Row>
    </>
  );
}

function NewGame({ defaults, onCancel, onCreate }) {
  const favorites = defaults.players.map((p) => p.trim()).filter(Boolean);
  const [name, setName] = useState(() => formatDate(Date.now()));
  const [opts, setOpts] = useState({ extraKniffel: defaults.extraKniffel, dice: defaults.dice });
  const [players, setPlayers] = useState(favorites.length ? [] : ["", ""]);
  const [error, setError] = useState("");

  const clean = players.map((p) => p.trim()).filter(Boolean);
  const n = clean.length;
  const picked = (f) => clean.some((p) => p.toLowerCase() === f.toLowerCase());
  const toggleFavorite = (f) => {
    setError("");
    if (picked(f)) setPlayers(players.filter((p) => p.trim().toLowerCase() !== f.toLowerCase()));
    else setPlayers([...players.filter((p) => p.trim()), f]);
  };

  const create = () => {
    if (!name.trim()) return setError("Du musst einen Namen eingeben.");
    if (n < 1) return setError("Trag mindestens einen Spieler ein.");
    if (new Set(clean.map((p) => p.toLowerCase())).size !== n) return setError("Jeder Spieler braucht einen eigenen Namen.");
    onCreate({ id: String(Date.now()), name: name.trim(), ...opts, players: clean, sheets: clean.map(() => ({})), log: [], created: Date.now() });
  };

  return (
    <div style={page} className="pop">
      <TopBar left={<IconBtn label="Spiele" onClick={onCancel}>‹ Spiele</IconBtn>} title="Neues Spiel" />
      <GameOptions opts={opts} setOpts={setOpts}>
        <Row><span style={{ color: C.dim, width: 64 }}>Name</span><input style={textInput} autoComplete="off" placeholder="z. B. Spieleabend" value={name} onChange={(e) => { setName(e.target.value); setError(""); }} /></Row>
      </GameOptions>

      {favorites.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ color: C.dim, fontSize: 14, fontWeight: 500, textTransform: "uppercase", letterSpacing: 0.6, margin: "0 6px 8px" }}>Standardspieler – antippen zum Auswählen</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {favorites.map((f) => {
              const on = picked(f);
              return (
                <button key={f} onClick={() => toggleFavorite(f)}
                  style={{ padding: "8px 14px", borderRadius: 20, fontSize: 15, cursor: "pointer", border: `1px solid ${on ? C.accent : C.line}`, background: on ? C.accent : C.card, color: on ? "#fff" : C.dim }}>
                  {on ? "✓ " : "+ "}{f}
                </button>
              );
            })}
          </div>
        </div>
      )}

      <Section title={`Spieler (${n})`} footer="Gib die Spieler in der Reihenfolge ein, in der gewürfelt wird – der Erste fängt an. Mit ▲ ▼ kannst du sie verschieben.">
        <PlayerRows players={players} setPlayers={(p) => { setPlayers(p); setError(""); }} />
      </Section>

      {error && <div style={{ background: "#f8717122", border: `1px solid ${C.bad}`, color: "#fecaca", borderRadius: 12, padding: "10px 14px", marginBottom: 12, textAlign: "center" }}>{error}</div>}
      <BigButton onClick={create} style={{ width: "100%" }}>Spiel erstellen</BigButton>
    </div>
  );
}

// Änderungen sind erst ein Entwurf und gelten nach „Speichern“
function Settings({ defaults, setDefaults, onBack }) {
  const [draft, setDraft] = useState(defaults);
  const [saved, setSaved] = useState(false);
  const [confirmLeave, setConfirmLeave] = useState(false);
  const favorites = draft.players.map((p) => p.trim()).filter(Boolean);
  const dirty = JSON.stringify(draft) !== JSON.stringify(defaults);
  const edit = (d) => { setDraft(d); setSaved(false); };
  const save = () => { setDefaults({ ...draft, players: favorites }); setDraft({ ...draft, players: favorites }); setSaved(true); };

  return (
    <div style={page} className="pop">
      <TopBar left={<IconBtn label="Spiele" onClick={() => (dirty ? setConfirmLeave(true) : onBack())}>‹ Spiele</IconBtn>} title="Einstellungen" />
      <div style={{ color: C.dim, fontSize: 14, margin: "0 6px 14px", lineHeight: 1.4 }}>Diese Werte sind bei jedem neuen Spiel schon vorausgewählt. Sie bleiben auf diesem Gerät gespeichert, auch in der App auf dem Home-Bildschirm.</div>
      <GameOptions opts={draft} setOpts={edit} />
      <Section title="Standardspieler" footer="Standardspieler erscheinen beim neuen Spiel als Liste zum Antippen.">
        <PlayerRows players={draft.players} setPlayers={(players) => edit({ ...draft, players })} />
      </Section>

      <BottomBar hint={dirty ? "Nicht gespeicherte Änderungen" : saved ? "Gespeichert ✓" : null} hintColor={dirty ? C.gold : C.good}>
        <BigButton disabled={!dirty} onClick={save}>{dirty || !saved ? "Speichern" : "Gespeichert ✓"}</BigButton>
      </BottomBar>

      {confirmLeave && (
        <Sheet title="Änderungen speichern?" onClose={() => setConfirmLeave(false)}>
          <div style={{ display: "flex", gap: 10 }}>
            <BigButton color={C.card2} onClick={onBack}>Verwerfen</BigButton>
            <BigButton onClick={() => { save(); onBack(); }}>Speichern</BigButton>
          </div>
        </Sheet>
      )}
    </div>
  );
}

// ── Würfeln ───────────────────────────────────────────────────────────────────
const rollDie = () => 1 + Math.floor(Math.random() * 6);

function DiceSheet({ game, p, onClose, onPick }) {
  const [dice, setDice] = useState([0, 0, 0, 0, 0]);
  const [held, setHeld] = useState([false, false, false, false, false]);
  const [rolls, setRolls] = useState(0);
  const [rolling, setRolling] = useState(0);
  const sheet = game.sheets[p];
  const rolled = rolls > 0;

  const roll = () => {
    setDice(dice.map((d, i) => (held[i] ? d : rollDie())));
    setRolls(rolls + 1);
    setRolling(rolling + 1);
  };
  const toggleHold = (i) => rolled && rolls < 3 && setHeld(held.map((h, j) => (j === i ? !h : h)));

  const open = FIELDS.filter((f) => sheet[f.id] == null);
  const bonusKniffel = rolled && isKniffel(dice) && sheet.kn === 50 && game.extraKniffel;

  return (
    <Sheet title={`🎲 ${game.players[p]} würfelt`} onClose={onClose}>
      <div key={rolling} style={{ display: "flex", justifyContent: "center", gap: 10, margin: "8px 0 14px" }}>
        {dice.map((d, i) => <Die key={i} value={d} held={held[i]} rolling={rolling > 0 && !held[i]} onClick={() => toggleHold(i)} />)}
      </div>
      <div style={{ textAlign: "center", color: C.dim, fontSize: 14, marginBottom: 12 }}>
        {!rolled ? "Drei Würfe pro Runde." : rolls < 3 ? "Würfel antippen zum Halten, dann nochmal würfeln – oder unten ein Feld wählen." : "Letzter Wurf – wähle ein Feld."}
      </div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
        <BigButton disabled={rolls >= 3 || held.every(Boolean)} onClick={roll}>
          {rolls === 0 ? "Würfeln" : rolls < 3 ? `Nochmal würfeln (${3 - rolls} übrig)` : "Keine Würfe mehr"}
        </BigButton>
      </div>
      {bonusKniffel && <div style={{ background: "#ffcc4d1a", border: "1px solid #ffcc4d55", borderRadius: 14, padding: "10px 14px", marginBottom: 12, fontSize: 14, textAlign: "center" }}>🎉 Zusatz-Kniffel! +50 Bonuspunkte werden gutgeschrieben.</div>}
      {rolled && (
        <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.line}` }}>
          {open.map((f, i) => {
            const pts = f.score(dice);
            return (
              <Row key={f.id} onClick={() => onPick(f.id, pts, bonusKniffel)} last={i === open.length - 1}>
                <span style={{ flex: 1 }}>{f.name}</span>
                <span style={{ fontWeight: 600, fontSize: 17, color: pts > 0 ? C.good : C.dim }}>{pts > 0 ? `+${pts}` : "streichen"}</span>
              </Row>
            );
          })}
        </div>
      )}
    </Sheet>
  );
}

// Feld von Hand eintragen (mit echten Würfeln gespielt)
function EntrySheet({ game, p, fieldId, onClose, onSet }) {
  const f = FIELD[fieldId];
  const cur = game.sheets[p][fieldId];
  const [free, setFree] = useState(cur && f.options === "free" ? String(cur) : "");
  const freeVal = parseInt(free, 10);
  const freeOk = !isNaN(freeVal) && freeVal >= 5 && freeVal <= 30;
  const opts = f.options === "free" ? null : f.fixed ? [f.fixed] : f.options.filter((v) => v > 0);
  const chip = (v, label) => (
    <button key={label} onClick={() => onSet(v)}
      style={{ minWidth: 64, height: 50, borderRadius: 14, border: `2px solid ${cur === v ? C.accent : C.line}`, background: cur === v ? "#ef444433" : C.card, color: C.text, fontSize: 18, fontWeight: 600, cursor: "pointer", padding: "0 12px" }}>{label}</button>
  );
  return (
    <Sheet title={`${f.name} – ${game.players[p]}`} onClose={onClose}>
      <div style={{ color: C.dim, textAlign: "center", marginBottom: 14 }}>{f.desc}</div>
      {opts && <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: 8, marginBottom: 12 }}>{opts.map((v) => chip(v, String(v)))}</div>}
      {!opts && (
        <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
          <input type="number" inputMode="numeric" placeholder="Augensumme (5–30)" value={free} onChange={(e) => setFree(e.target.value)}
            style={{ flex: 1, minWidth: 0, height: 50, borderRadius: 14, border: `1px solid ${C.line}`, background: C.card, color: C.text, fontSize: 18, padding: "0 14px", outline: "none" }} />
          <BigButton disabled={!freeOk} onClick={() => onSet(freeVal)} style={{ flex: "0 0 110px" }}>Eintragen</BigButton>
        </div>
      )}
      <div style={{ display: "flex", gap: 10 }}>
        <BigButton color={C.card2} onClick={() => onSet(0)}>✗ Streichen (0)</BigButton>
        {cur != null && <BigButton color="#7f1d1d" onClick={() => onSet(null)}>Leeren</BigButton>}
      </div>
    </Sheet>
  );
}

// ── Spielblock ────────────────────────────────────────────────────────────────
function ScoreSheet({ game, onCell }) {
  const cur = isFinished(game) ? -1 : currentPlayer(game);
  const scores = game.sheets.map((s) => playerScore(s, game.extraKniffel));
  const cell = (p, f) => {
    const v = game.sheets[p][f.id];
    return (
      <td key={p} onClick={() => onCell(p, f.id)} style={{ cursor: "pointer", background: p === cur ? "#ef444414" : "transparent" }}>
        {v == null ? <span style={{ color: "#ffffff30" }}>·</span> : v === 0 ? <span style={{ color: C.bad }}>✗</span> : <b style={{ fontWeight: 600 }}>{v}</b>}
      </td>
    );
  };
  const sumRow = (label, get, strong) => (
    <tr style={{ background: "#ffffff08" }}>
      <td style={{ color: strong ? C.gold : C.dim, fontWeight: strong ? 600 : 400 }}>{label}</td>
      {scores.map((s, p) => <td key={p} style={{ color: strong ? C.gold : C.dim, fontWeight: strong ? 700 : 500, background: p === cur ? "#ef444414" : "transparent" }}>{get(s, p)}</td>)}
    </tr>
  );
  return (
    <div style={{ background: C.card, borderRadius: 16, border: `1px solid ${C.line}`, overflow: "auto", marginBottom: 20 }}>
      <table className="sheet-table">
        <thead>
          <tr>
            <th style={{ minWidth: 104 }}></th>
            {game.players.map((n, p) => <th key={p} style={{ color: p === cur ? C.accent : C.text, minWidth: 58, maxWidth: 90, overflow: "hidden", textOverflow: "ellipsis" }}>{p === cur ? "🎲 " : ""}{n}</th>)}
          </tr>
        </thead>
        <tbody>
          {UPPER.map((f) => <tr key={f.id}><td>{f.name}</td>{game.players.map((_, p) => cell(p, f))}</tr>)}
          {sumRow("Summe oben", (s) => s.upper)}
          {sumRow(`Bonus (ab ${BONUS_LIMIT})`, (s) => (s.bonus ? `+${s.bonus}` : s.upper >= BONUS_LIMIT ? "" : <span style={{ fontSize: 12 }}>noch {BONUS_LIMIT - s.upper}</span>))}
          {LOWER.map((f) => <tr key={f.id}><td>{f.name}</td>{game.players.map((_, p) => cell(p, f))}</tr>)}
          {game.extraKniffel && (
            <tr><td>Zusatz-Kniffel</td>{game.players.map((_, p) => (
              <td key={p} onClick={() => onCell(p, "extra")} style={{ cursor: "pointer", background: p === cur ? "#ef444414" : "transparent" }}>
                {game.sheets[p].extra ? <b>+{game.sheets[p].extra * 50}</b> : <span style={{ color: "#ffffff30" }}>·</span>}
              </td>))}
            </tr>
          )}
          {sumRow("Summe unten", (s) => s.lower)}
          {sumRow("Gesamt", (s) => s.total, true)}
        </tbody>
      </table>
    </div>
  );
}

function GameView({ game, onBack, onUpdate, onDelete, justFinished, onEndSeen, onFinish }) {
  const [tab, setTab] = useState("block");
  const [entry, setEntry] = useState(null);
  const [dice, setDice] = useState(false);
  const [extraFor, setExtraFor] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const fin = isFinished(game);
  const cur = fin ? -1 : currentPlayer(game);
  const rank = ranking(game);

  const setField = (p, id, v, bonus) => {
    const sheets = game.sheets.map((s, i) => {
      if (i !== p) return s;
      const n = { ...s, [id]: v };
      if (v === null) delete n[id];
      if (bonus) n.extra = (n.extra || 0) + 1;
      return n;
    });
    const next = { ...game, sheets };
    onUpdate(next);
    if (!fin && isFinished(next)) onFinish();
  };

  return (
    <div style={page} className="pop">
      <TopBar left={<IconBtn label="Spiele" onClick={onBack}>‹ Spiele</IconBtn>} title={game.name} />
      <div style={{ marginBottom: 16 }}>
        <Segmented value={tab} onChange={setTab} options={[{ id: "block", name: "Block" }, { id: "stand", name: "Stand" }, { id: "info", name: "Info" }]} />
      </div>

      {tab === "block" && (
        <>
          {!fin && <div style={{ textAlign: "center", color: C.dim, marginBottom: 10 }}>
            Runde {roundNo(game)} von 13 · <span style={{ color: C.text }}>{game.players[cur]}</span> ist dran
          </div>}
          <ScoreSheet game={game} onCell={(p, id) => (id === "extra" ? setExtraFor(p) : setEntry({ p, id }))} />
          <div style={{ color: C.dim, fontSize: 13, margin: "-8px 6px 0", lineHeight: 1.4 }}>Feld antippen, um einen Wert von Hand einzutragen, zu streichen oder zu korrigieren.</div>
        </>
      )}

      {tab === "stand" && (
        <Section title={fin ? "Endstand" : "Zwischenstand"}>
          {rank.map((r, i) => {
            const s = playerScore(game.sheets[r.p], game.extraKniffel);
            return (
              <Row key={r.p} last={i === rank.length - 1}>
                <span style={{ width: 34, fontSize: r.place <= 3 ? 22 : 16, textAlign: "center", color: C.dim }}>{medal(r.place)}</span>
                <span style={{ flex: 1 }}>
                  <div style={{ fontSize: 17 }}>{r.name}</div>
                  <div style={{ fontSize: 12, color: C.dim }}>oben {s.upperTotal} · unten {s.lower} · {filledCount(game.sheets[r.p])}/13 Felder</div>
                </span>
                <span style={{ fontSize: 19, fontWeight: 600 }}>{r.score}</span>
              </Row>
            );
          })}
        </Section>
      )}

      {tab === "info" && (
        <>
          <Section title="Allgemein">
            <Row><span style={{ flex: 1 }}>Spieler</span><span style={{ color: C.dim }}>{game.players.length}</span></Row>
            <Row><span style={{ flex: 1 }}>Zusatz-Kniffel</span><span style={{ color: C.dim }}>{game.extraKniffel ? "an" : "aus"}</span></Row>
            <Row><span style={{ flex: 1 }}>Würfel in der App</span><Toggle on={game.dice} onChange={(v) => onUpdate({ ...game, dice: v })} /></Row>
            <Row last><span style={{ flex: 1 }}>Erstellt</span><span style={{ color: C.dim }}>{formatDate(game.created)}</span></Row>
          </Section>
          <Section title="Punkte" footer={`Oben zählen nur die Augen der jeweiligen Zahl. Ab ${BONUS_LIMIT} Punkten oben gibt es ${BONUS} Bonuspunkte. Pasche und Chance zählen alle Augen. Full House 25, kleine Straße (4 in Folge) 30, große Straße (5 in Folge) 40, Kniffel (5 gleiche) 50.`}>
            <Row last><span style={{ flex: 1 }}>Felder pro Spieler</span><span style={{ color: C.dim }}>13</span></Row>
          </Section>
          <BigButton color="#7f1d1d" onClick={() => setConfirmDelete(true)} style={{ width: "100%" }}>Spiel löschen</BigButton>
        </>
      )}

      {!fin && game.dice && tab !== "info" && (
        <BottomBar>
          <BigButton onClick={() => setDice(true)}>🎲 {game.players[cur]} würfelt</BigButton>
        </BottomBar>
      )}

      {dice && <DiceSheet game={game} p={cur} onClose={() => setDice(false)} onPick={(id, v, bonus) => { setDice(false); setField(cur, id, v, bonus); }} />}

      {entry && <EntrySheet game={game} p={entry.p} fieldId={entry.id} onClose={() => setEntry(null)} onSet={(v) => { setField(entry.p, entry.id, v); setEntry(null); }} />}

      {extraFor !== null && (
        <Sheet title={`Zusatz-Kniffel – ${game.players[extraFor]}`} onClose={() => setExtraFor(null)}>
          <div style={{ color: C.dim, textAlign: "center", marginBottom: 14 }}>Je weiterem Kniffel 50 Bonuspunkte.</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 18, marginBottom: 16 }}>
            {["−", "+"].map((s, i) => {
              const n = game.sheets[extraFor].extra || 0;
              const dis = i === 0 && n === 0;
              const btn = <button key={s} disabled={dis} onClick={() => onUpdate({ ...game, sheets: game.sheets.map((sh, j) => (j === extraFor ? { ...sh, extra: n + (i ? 1 : -1) } : sh)) })}
                style={{ width: 54, height: 54, borderRadius: 27, border: "none", background: dis ? "#3a3150" : C.card2, color: C.text, fontSize: 26, cursor: dis ? "default" : "pointer" }}>{s}</button>;
              return i === 0 ? [btn, <span key="n" style={{ fontSize: 28, fontWeight: 700, minWidth: 70, textAlign: "center" }}>+{n * 50}</span>] : btn;
            })}
          </div>
          <BigButton onClick={() => setExtraFor(null)} style={{ width: "100%" }}>Fertig</BigButton>
        </Sheet>
      )}

      {justFinished && fin && (
        <Sheet title="🏆 Spiel beendet!" onClose={onEndSeen}>
          <div style={{ textAlign: "center", marginBottom: 14 }}>
            <div style={{ fontSize: 22, fontWeight: 700, color: C.gold }}>{rank.filter((r) => r.place === 1).map((r) => r.name).join(" & ")}</div>
            <div style={{ color: C.dim }}>gewinnt mit {rank[0].score} Punkten</div>
          </div>
          <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.line}`, marginBottom: 16 }}>
            {rank.map((r, i) => (
              <Row key={r.p} last={i === rank.length - 1}>
                <span style={{ width: 30, textAlign: "center", color: C.dim }}>{medal(r.place)}</span>
                <span style={{ flex: 1 }}>{r.name}</span>
                <span style={{ fontWeight: 600 }}>{r.score}</span>
              </Row>
            ))}
          </div>
          <div style={{ color: C.dim, textAlign: "center", marginBottom: 12 }}>Was soll mit dem Spiel passieren?</div>
          <div style={{ display: "flex", gap: 10 }}>
            <BigButton color={C.card2} onClick={onDelete}>🗑 Spiel löschen</BigButton>
            <BigButton onClick={onEndSeen}>💾 Spiel behalten</BigButton>
          </div>
        </Sheet>
      )}

      {confirmDelete && (
        <Sheet title="Spiel löschen?" onClose={() => setConfirmDelete(false)}>
          <div style={{ color: C.dim, textAlign: "center", marginBottom: 16 }}>„{game.name}" wird endgültig gelöscht.</div>
          <div style={{ display: "flex", gap: 10 }}>
            <BigButton color={C.card2} onClick={() => setConfirmDelete(false)}>Abbrechen</BigButton>
            <BigButton color={C.bad} onClick={onDelete}>Löschen</BigButton>
          </div>
        </Sheet>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [state, setState] = useState(loadState);
  const [view, setView] = useState(() => state.view || { name: "list" });

  useEffect(() => { saveState({ ...state, view }); }, [state, view]);

  const game = view.gameId ? state.games.find((g) => g.id === view.gameId) : null;
  const defaults = { ...DEFAULTS, ...state.defaults };
  const list = <GameList games={state.games} onOpen={(id) => setView({ name: "game", gameId: id })} onNew={() => setView({ name: "new" })} onSettings={() => setView({ name: "settings" })} />;

  if (view.name === "game" && !game) return list;

  if (view.name === "settings")
    return <Settings defaults={defaults} setDefaults={(d) => setState((s) => ({ ...s, defaults: d }))} onBack={() => setView({ name: "list" })} />;

  if (view.name === "new")
    return <NewGame defaults={defaults} onCancel={() => setView({ name: "list" })}
      onCreate={(g) => { setState((s) => ({ ...s, games: [...s.games, g] })); setView({ name: "game", gameId: g.id }); }} />;

  if (view.name === "game")
    return <GameView game={game} justFinished={view.finished}
      onFinish={() => setView({ name: "game", gameId: game.id, finished: true })}
      onEndSeen={() => setView({ name: "game", gameId: game.id })}
      onBack={() => setView({ name: "list" })}
      onUpdate={(g) => setState((s) => ({ ...s, games: s.games.map((x) => (x.id === g.id ? g : x)) }))}
      onDelete={() => { setState((s) => ({ ...s, games: s.games.filter((g) => g.id !== game.id) })); setView({ name: "list" }); }} />;

  return list;
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
